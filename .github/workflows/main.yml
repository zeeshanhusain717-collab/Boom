          cat > $SRC/CubemapRenderer.kt <<'EOF'
          package com.zeeshan.cameraapp

          import android.graphics.Bitmap
          import android.opengl.GLES20
          import android.opengl.GLSurfaceView
          import android.opengl.GLUtils
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.FloatBuffer
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.math.tan

          class CubemapRenderer : GLSurfaceView.Renderer {
              companion object {
                  const val DEFAULT_FOV = 70f
                  const val MIN_FOV = 25f
                  const val MAX_FOV = 90f
                  const val MAX_PITCH = 1.45f

                  private const val VERTEX_SHADER = """
                      attribute vec2 aPos;
                      uniform mat3 uRot;
                      uniform vec2 uTanHalf;
                      varying vec3 vDir;
                      void main() {
                          vDir = uRot * vec3(aPos.x * uTanHalf.x, aPos.y * uTanHalf.y, -1.0);
                          gl_Position = vec4(aPos, 0.0, 1.0);
                      }
                  """

                  private const val FRAGMENT_SHADER = """
                      precision mediump float;
                      uniform samplerCube uCube;
                      varying vec3 vDir;
                      void main() {
                          gl_FragColor = textureCube(uCube, normalize(vDir));
                      }
                  """
              }

              @Volatile private var pendingFaces: Array<Bitmap>? = null
              @Volatile var yaw = 0f
              @Volatile var pitch = 0f
              @Volatile var fovY = DEFAULT_FOV

              private var program = 0
              private var cubeTex = 0
              private var aPos = 0
              private var uRot = 0
              private var uTanHalf = 0
              private var uCube = 0
              private var aspect = 1f
              private var hasFaces = false

              private val quad: FloatBuffer = ByteBuffer
                  .allocateDirect(8 * 4)
                  .order(ByteOrder.nativeOrder())
                  .asFloatBuffer()
                  .apply {
                      put(floatArrayOf(-1f, -1f, 1f, -1f, -1f, 1f, 1f, 1f))
                      position(0)
                  }

              private val faceTargets = intArrayOf(
                  GLES20.GL_TEXTURE_CUBE_MAP_POSITIVE_X,
                  GLES20.GL_TEXTURE_CUBE_MAP_NEGATIVE_X,
                  GLES20.GL_TEXTURE_CUBE_MAP_POSITIVE_Y,
                  GLES20.GL_TEXTURE_CUBE_MAP_NEGATIVE_Y,
                  GLES20.GL_TEXTURE_CUBE_MAP_POSITIVE_Z,
                  GLES20.GL_TEXTURE_CUBE_MAP_NEGATIVE_Z
              )

              fun setFaces(faces: Array<Bitmap>) {
                  pendingFaces = faces
              }

              fun orbit(distX: Float, distY: Float, viewHeightPx: Int) {
                  val k = Math.toRadians(fovY.toDouble()).toFloat() / viewHeightPx.coerceAtLeast(1)
                  yaw += distX * k
                  pitch = (pitch - distY * k).coerceIn(-MAX_PITCH, MAX_PITCH)
              }

              fun zoom(scaleFactor: Float) {
                  fovY = (fovY / scaleFactor).coerceIn(MIN_FOV, MAX_FOV)
              }

              fun reset() {
                  yaw = 0f
                  pitch = 0f
                  fovY = DEFAULT_FOV
              }

              override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                  GLES20.glClearColor(0f, 0f, 0f, 1f)
                  program = linkProgram(VERTEX_SHADER, FRAGMENT_SHADER)
                  aPos = GLES20.glGetAttribLocation(program, "aPos")
                  uRot = GLES20.glGetUniformLocation(program, "uRot")
                  uTanHalf = GLES20.glGetUniformLocation(program, "uTanHalf")
                  uCube = GLES20.glGetUniformLocation(program, "uCube")

                  val tex = IntArray(1)
                  GLES20.glGenTextures(1, tex, 0)
                  cubeTex = tex[0]
                  GLES20.glBindTexture(GLES20.GL_TEXTURE_CUBE_MAP, cubeTex)
                  GLES20.glTexParameteri(GLES20.GL_TEXTURE_CUBE_MAP, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR)
                  GLES20.glTexParameteri(GLES20.GL_TEXTURE_CUBE_MAP, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR)
                  GLES20.glTexParameteri(GLES20.GL_TEXTURE_CUBE_MAP, GLES20.GL_TEXTURE_WRAP_S, GLES20.GL_CLAMP_TO_EDGE)
                  GLES20.glTexParameteri(GLES20.GL_TEXTURE_CUBE_MAP, GLES20.GL_TEXTURE_WRAP_T, GLES20.GL_CLAMP_TO_EDGE)
              }

              override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) {
                  GLES20.glViewport(0, 0, width, height)
                  aspect = width.toFloat() / height.coerceAtLeast(1)
              }

              override fun onDrawFrame(gl: GL10?) {
                  val faces = pendingFaces
                  if (faces != null) {
                      pendingFaces = null
                      uploadFaces(faces)
                  }
                  GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT)
                  if (!hasFaces) return

                  GLES20.glUseProgram(program)
                  GLES20.glActiveTexture(GLES20.GL_TEXTURE0)
                  GLES20.glBindTexture(GLES20.GL_TEXTURE_CUBE_MAP, cubeTex)
                  GLES20.glUniform1i(uCube, 0)
                  GLES20.glUniformMatrix3fv(uRot, 1, false, rotationMatrix(yaw, pitch), 0)

                  val tanY = tan(Math.toRadians(fovY.toDouble() / 2.0)).toFloat()
                  GLES20.glUniform2f(uTanHalf, tanY * aspect, tanY)

                  GLES20.glEnableVertexAttribArray(aPos)
                  GLES20.glVertexAttribPointer(aPos, 2, GLES20.GL_FLOAT, false, 0, quad)
                  GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4)
                  GLES20.glDisableVertexAttribArray(aPos)
              }

              private fun uploadFaces(faces: Array<Bitmap>) {
                  GLES20.glBindTexture(GLES20.GL_TEXTURE_CUBE_MAP, cubeTex)
                  for (i in faceTargets.indices) {
                      GLUtils.texImage2D(faceTargets[i], 0, faces[i], 0)
                  }
                  faces.forEach { it.recycle() }
                  hasFaces = true
              }

              private fun rotationMatrix(yaw: Float, pitch: Float): FloatArray {
                  val cy = cos(yaw)
                  val sy = sin(yaw)
                  val cp = cos(pitch)
                  val sp = sin(pitch)
                  return floatArrayOf(
                      cy, 0f, -sy,
                      sy * sp, cp, cy * sp,
                      sy * cp, -sp, cy * cp
                  )
              }

              private fun linkProgram(vsSrc: String, fsSrc: String): Int {
                  val vs = compileShader(GLES20.GL_VERTEX_SHADER, vsSrc)
                  val fs = compileShader(GLES20.GL_FRAGMENT_SHADER, fsSrc)
                  val prog = GLES20.glCreateProgram()
                  GLES20.glAttachShader(prog, vs)
                  GLES20.glAttachShader(prog, fs)
                  GLES20.glLinkProgram(prog)
                  val status = IntArray(1)
                  GLES20.glGetProgramiv(prog, GLES20.GL_LINK_STATUS, status, 0)
                  check(status[0] != 0) { "Program link failed: ${GLES20.glGetProgramInfoLog(prog)}" }
                  GLES20.glDeleteShader(vs)
                  GLES20.glDeleteShader(fs)
                  return prog
              }

              private fun compileShader(type: Int, src: String): Int {
                  val shader = GLES20.glCreateShader(type)
                  GLES20.glShaderSource(shader, src)
                  GLES20.glCompileShader(shader)
                  val status = IntArray(1)
                  GLES20.glGetShaderiv(shader, GLES20.GL_COMPILE_STATUS, status, 0)
                  check(status[0] != 0) { "Shader compile failed: ${GLES20.glGetShaderInfoLog(shader)}" }
                  return shader
              }
          }
          EOF

      # ------------------------------------------------------------------
