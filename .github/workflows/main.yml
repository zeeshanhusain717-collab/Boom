name: Build ZAI AI App APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ZAI AI App APK
    runs-on: ubuntu-latest

    steps:
      - name: 01 - Checkout repository
        uses: actions/checkout@v4

      - name: 02 - Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: 03 - Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 04 - Install Android SDK 34
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 05 - Create project directories
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zai/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

      - name: 06 - Write gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

      - name: 07 - Write settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZAI"
          include(":app")
          EOF

      - name: 08 - Write root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

      - name: 09 - Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: 10 - Write app/build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zai.app"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zai.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

      - name: 11 - Write strings.xml & colors.xml
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">. Z Ai .</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="royal_blue">#0F52BA</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
              <color name="bg_gray">#E5E7EB</color>
          </resources>
          EOF

      - name: 12 - Create White 3D Vector Z Logo and App Launcher Icon
        run: |
          cat > app/src/main/res/drawable/ic_z_3d_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="100dp"
              android:height="100dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <group
                  android:translateX="3"
                  android:translateY="4">
                  <path
                      android:fillColor="#0369A1"
                      android:pathData="M25,25 L75,25 L75,37 L42,67 L75,67 L75,79 L25,79 L25,67 L58,37 L25,37 Z" />
              </group>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M25,25 L75,25 L75,37 L42,67 L75,67 L75,79 L25,79 L25,67 L58,37 L25,37 Z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#38BDF8"/>
                          <item android:offset="1.0" android:color="#0F52BA"/>
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF
          
          cat > app/src/main/res/drawable/ic_launcher_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:translateX="3"
                  android:translateY="4">
                  <path
                      android:fillColor="#0369A1"
                      android:pathData="M30,30 L78,30 L78,42 L48,68 L78,68 L78,78 L30,78 L30,68 L60,42 L30,42 Z" />
              </group>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M30,30 L78,30 L78,42 L48,68 L78,68 L78,78 L30,78 L30,68 L60,42 L30,42 Z" />
          </vector>
          EOF
          
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF

      - name: 13 - Write AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

      - name: 14 - Write MainActivity.kt (Custom UI & Permissions)
        run: |
          cat > app/src/main/java/com/zai/app/MainActivity.kt <<'EOF'
          package com.zai.app

          import android.Manifest
          import android.animation.ObjectAnimator
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.animation.OvershootInterpolator
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var splashView: LinearLayout
              private lateinit var mainContainer: LinearLayout
              private lateinit var chatLayout: LinearLayout
              private lateinit var inputEditText: EditText

              private val PERMISSION_REQUEST_CODE = 101

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val rootLayout = FrameLayout(this).apply {
                      setBackgroundColor(Color.parseColor("#0F52BA"))
                  }

                  // 1. Splash Screen
                  splashView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )

                      val logoImg = ImageView(context).apply {
                          setImageResource(R.drawable.ic_z_3d_logo)
                          layoutParams = LinearLayout.LayoutParams(220, 220)
                      }

                      val appTitle = TextView(context).apply {
                          text = ". Z Ai ."
                          textSize = 34f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.WHITE)
                          setPadding(0, 20, 0, 0)
                      }

                      addView(logoImg)
                      addView(appTitle)
                  }

                  // 2. Main Container
                  mainContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                      setBackgroundColor(Color.parseColor("#E5E7EB"))
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  }

                  // Top Header Bar
                  val headerBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(30, 40, 30, 40)
                      setBackgroundColor(Color.parseColor("#0F52BA"))
                      elevation = 12f
                  }

                  val textZAI = TextView(this).apply {
                      text = ", Z Ai "
                      textSize = 24f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                  }

                  val verticalDivider = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(4, 60).apply {
                          setMargins(15, 0, 15, 0)
                      }
                      setBackgroundColor(Color.WHITE)
                  }

                  val textZeeshan = TextView(this).apply {
                      text = ", Zeeshan "
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val roundMenuBtn = ImageButton(this).apply {
                      setImageResource(R.drawable.ic_z_3d_logo)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.WHITE)
                      }
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      setPadding(10, 10, 10, 10)
                      layoutParams = LinearLayout.LayoutParams(100, 100)

                      setOnClickListener { view ->
                          openOptionMenu(view)
                      }
                  }

                  headerBar.addView(textZAI)
                  headerBar.addView(verticalDivider)
                  headerBar.addView(textZeeshan)
                  headerBar.addView(roundMenuBtn)

                  // Chat Message Scroll View
                  val scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                      isFillViewport = true
                  }

                  chatLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 30, 30, 30)
                  }

                  add3DWelcomeMessage(". Welcome to Z AI ! How can I help you?")

                  scrollView.addView(chatLayout)

                  // Bottom Input Dock
                  val inputDock = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(20, 20, 20, 20)
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 60f
                      }
                      elevation = 16f
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(20, 10, 20, 20)
                      }
                  }

                  val micBtn = createIconButton("🎙️") {
                      checkAndRequestPermissions()
                  }

                  val galleryBtn = createIconButton("🖼️") {
                      checkAndRequestPermissions()
                  }

                  val videoBtn = createIconButton("🎥") {
                      checkAndRequestPermissions()
                  }

                  inputEditText = EditText(this).apply {
                      hint = "यहाँ संदेश या सवाल लिखें..."
                      textSize = 14f
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.BLACK)
                      setPadding(30, 20, 30, 20)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#F1F5F9"))
                          cornerRadius = 40f
                      }
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          setMargins(10, 0, 10, 0)
                      }
                  }

                  val sendBtn = Button(this).apply {
                      text = "✈"
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#0F52BA"))
                      }
                      layoutParams = LinearLayout.LayoutParams(110, 110)

                      setOnClickListener {
                          val txt = inputEditText.text.toString().trim()
                          if (txt.isNotEmpty()) {
                              addMessageBubble(txt, isUser = true)
                              inputEditText.text.clear()
                          }
                      }
                  }

                  inputDock.addView(micBtn)
                  inputDock.addView(galleryBtn)
                  inputDock.addView(videoBtn)
                  inputDock.addView(inputEditText)
                  inputDock.addView(sendBtn)

                  mainContainer.addView(headerBar)
                  mainContainer.addView(scrollView)
                  mainContainer.addView(inputDock)

                  rootLayout.addView(splashView)
                  rootLayout.addView(mainContainer)

                  setContentView(rootLayout)

                  runSplashAnimation()
              }

              private fun checkAndRequestPermissions() {
                  val permissions = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissions.add(Manifest.permission.READ_MEDIA_IMAGES)
                      permissions.add(Manifest.permission.READ_MEDIA_VIDEO)
                  } else {
                      permissions.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }

                  val listPermissionsNeeded = permissions.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }

                  if (listPermissionsNeeded.isNotEmpty()) {
                      ActivityCompat.requestPermissions(
                          this,
                          listPermissionsNeeded.toTypedArray(),
                          PERMISSION_REQUEST_CODE
                      )
                  }
              }

              private fun openOptionMenu(view: View) {
                  val popup = PopupMenu(this, view)
                  popup.menu.add("🎥 वीडियो जनरेट (Video Generate)")
                  popup.menu.add("🎨 इमेज जनरेट (Image Generate)")
                  popup.menu.add("💻 कोड जनरेट (Code Generate)")
                  popup.menu.add("💬 सामान्य बातचीत व स्वास्थ्य (General)")

                  popup.setOnMenuItemClickListener { item ->
                      Toast.makeText(this, item.title, Toast.LENGTH_SHORT).show()
                      true
                  }
                  popup.show()
              }

              private fun add3DWelcomeMessage(text: String) {
                  val bubble = TextView(this).apply {
                      this.text = text
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      setPadding(40, 35, 40, 35)
                      elevation = 10f

                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#6B7280"))
                          cornerRadius = 30f
                          setStroke(2, Color.parseColor("#4B5563"))
                      }
                  }

                  val params = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      setMargins(0, 20, 0, 20)
                  }

                  chatLayout.addView(bubble, params)
              }

              private fun addMessageBubble(text: String, isUser: Boolean) {
                  val bubble = TextView(this).apply {
                      this.text = text
                      textSize = 14f
                      setPadding(35, 25, 35, 25)
                      elevation = 4f

                      if (isUser) {
                          setTextColor(Color.WHITE)
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor("#0F52BA"))
                              cornerRadii = floatArrayOf(40f, 40f, 0f, 40f, 40f, 40f, 40f, 40f)
                          }
                      } else {
                          setTextColor(Color.parseColor("#1E293B"))
                          background = GradientDrawable().apply {
                              setColor(Color.WHITE)
                              cornerRadii = floatArrayOf(0f, 40f, 40f, 40f, 40f, 40f, 40f, 40f)
                          }
                      }
                  }

                  val params = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      gravity = if (isUser) Gravity.END else Gravity.START
                      setMargins(0, 15, 0, 15)
                  }

                  chatLayout.addView(bubble, params)
              }

              private fun createIconButton(icon: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = icon
                      textSize = 16f
                      setBackgroundColor(Color.TRANSPARENT)
                      layoutParams = LinearLayout.LayoutParams(90, 90)
                      setOnClickListener { onClick() }
                  }
              }

              private fun runSplashAnimation() {
                  val scaleX = ObjectAnimator.ofFloat(splashView, "scaleX", 0.8f, 1.1f, 1.0f).setDuration(1000)
                  val scaleY = ObjectAnimator.ofFloat(splashView, "scaleY", 0.8f, 1.1f, 1.0f).setDuration(1000)
                  scaleX.interpolator = OvershootInterpolator()
                  scaleY.interpolator = OvershootInterpolator()
                  scaleX.start()
                  scaleY.start()

                  splashView.postDelayed({
                      checkAndRequestPermissions()
                      splashView.animate().alpha(0f).setDuration(400).withEndAction {
                          splashView.visibility = View.GONE
                          mainContainer.visibility = View.VISIBLE
                          mainContainer.alpha = 0f
                          mainContainer.animate().alpha(1f).setDuration(400).start()
                      }.start()
                  }, 2000)
              }
          }
          EOF

      - name: 15 - Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 16 - Upload ZAI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAI-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
