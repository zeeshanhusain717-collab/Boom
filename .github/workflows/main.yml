name: Build Zeeshan Camera Pro APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Robust Android SDK & Command-Line Tools
        run: |
          set -euo pipefail
          echo "📂 Setting up Android SDK manually to bypass outdated action errors..."
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          
          # Download latest official Android command-line tools directly from Google
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandlinetools.zip
          unzip -q commandlinetools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          rm commandlinetools.zip

          # Configure paths
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

          # Accept SDK licenses and install required packages
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # ------------------------------------------------------------------
      # Step 1: Gradle build scripts and project settings
      # ------------------------------------------------------------------
      - name: Generate Gradle build files
        run: |
          set -euo pipefail
          rm -rf app
          mkdir -p app/src/main/java/com/zeeshan/cameraapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p .github/workflows

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanCameraPro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }

          android {
              namespace "com.zeeshan.cameraapp"
              compileSdk 34

              defaultConfig {
                  applicationId "com.zeeshan.cameraapp"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.recyclerview:recyclerview:1.3.2"
              implementation "androidx.camera:camera-core:1.3.1"
              implementation "androidx.camera:camera-camera2:1.3.1"
              implementation "androidx.camera:camera-lifecycle:1.3.1"
              implementation "androidx.camera:camera-view:1.3.1"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.camera.any" android:required="true" />
              <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />

              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ViewerActivity"
                      android:exported="false"
                      android:screenOrientation="portrait" />
              </application>
          </manifest>
          EOF

      # ------------------------------------------------------------------
      # Step 2: Resources (strings, colours, layouts)
      # ------------------------------------------------------------------
      - name: Generate Android resources
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="app_bg">#030712</color>
              <color name="accent">#8B5CF6</color>
              <color name="thumb_bg">#1F2937</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zeeshan Camera Pro</string>
              <string name="shoot">Shoot</string>
              <string name="start_sweep">Start 360° sweep</string>
              <string name="cancel">Cancel</string>
              <string name="finish">Finish</string>
              <string name="camera_denied">Camera permission is required</string>
              <string name="error_camera">Camera failed to start</string>
              <string name="error_capture">Capture failed, try again</string>
              <string name="error_build">Could not build the 3D photo</string>
              <string name="error_open">Could not open this 3D photo</string>
              <string name="error_not_enough_frames">Capture at least 6 frames first</string>
              <string name="building">Building cubemap… %1$d%%</string>
              <string name="saved">3D photo saved</string>
              <string name="manual_mode">Manual mode: no rotation sensor</string>
              <string name="tilt_warning">Hold phone upright</string>
              <string name="progress_frames">Frames: %1$d · %2$d°</string>
              <string name="progress_manual">Frames: %1$d</string>
              <string name="viewer_hint">Drag to look · Pinch to zoom · Double-tap to reset</string>
              <string name="thumb_desc">3D photo thumbnail</string>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/app_bg">

              <androidx.camera.view.PreviewView
                  android:id="@+id/viewFinder"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top|center_horizontal"
                  android:layout_marginTop="48dp"
                  android:background="#B3000000"
                  android:padding="10dp"
                  android:textColor="@android:color/white"
                  android:textSize="14sp" />

              <ProgressBar
                  android:id="@+id/busyIndicator"
                  android:layout_width="56dp"
                  android:layout_height="56dp"
                  android:layout_gravity="center"
                  android:indeterminate="true"
                  android:visibility="gone" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:orientation="vertical"
                  android:paddingBottom="24dp">

                  <androidx.recyclerview.widget.RecyclerView
                      android:id="@+id/galleryList"
                      android:layout_width="match_parent"
                      android:layout_height="80dp"
                      android:paddingHorizontal="8dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center"
                      android:orientation="horizontal"
                      android:paddingTop="12dp">

                      <Button
                          android:id="@+id/btnShutter"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:backgroundTint="@color/accent"
                          android:text="@string/shoot"
                          android:textColor="@android:color/white" />

                      <Button
                          android:id="@+id/btnFinish"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginStart="16dp"
                          android:text="@string/finish" />
                  </LinearLayout>
              </LinearLayout>
          </FrameLayout>
          EOF

          cat > app/src/main/res/layout/activity_viewer.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/app_bg">

              <android.opengl.GLSurfaceView
                  android:id="@+id/glView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <ProgressBar
                  android:id="@+id/loading"
                  android:layout_width="48dp"
                  android:layout_height="48dp"
                  android:layout_gravity="center"
                  android:indeterminate="true" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom|center_horizontal"
                  android:layout_marginBottom="32dp"
                  android:background="#B3000000"
                  android:padding="8dp"
                  android:text="@string/viewer_hint"
                  android:textColor="@android:color/white"
                  android:textSize="12sp" />
          </FrameLayout>
          EOF

          cat > app/src/main/res/layout/item_thumb.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="72dp"
              android:layout_height="72dp"
              android:padding="2dp">

              <ImageView
                  android:id="@+id/thumbImage"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="@color/thumb_bg"
                  android:contentDescription="@string/thumb_desc"
                  android:scaleType="centerCrop" />
          </FrameLayout>
          EOF

      # ------------------------------------------------------------------
      # Step 3: Kotlin sources
      # ------------------------------------------------------------------
      - name: Generate Kotlin sources
        run: |
          set -euo pipefail
          SRC=app/src/main/java/com/zeeshan/cameraapp

          cat > $SRC/CubemapProcessor.kt <<'EOF'
          package com.zeeshan.cameraapp

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.os.Process
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.asin
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.floor
          import kotlin.math.sqrt
          import kotlin.math.tan

          object CubemapProcessor {
              const val STEP_DEG = 12f
              const val FULL_SWEEP_FRAMES = 30
              const val MIN_FRAMES = 6
              const val FRAME_W = 480
              const val FRAME_H = 640
              const val H_FOV_DEG = 50.0
              const val V_FOV_DEG = 68.0
              const val PANO_W = 1024
              const val PANO_H = 512
              const val FACE_SIZE = 512
              private const val THUMB_SIZE = 256
              private const val FRONT_INDEX = 5
              private const val OPAQUE_BLACK = -16777216

              data class Frame(val file: File, val yawDeg: Float)

              fun newSingleWorker(name: String): ExecutorService =
                  Executors.newSingleThreadExecutor { runnable ->
                      Thread({
                          Process.setThreadPriority(Process.THREAD_PRIORITY_BACKGROUND)
                          runnable.run()
                      }, name).apply { isDaemon = true }
                  }

              fun build(
                  frames: List<Frame>,
                  outFile: File,
                  sensorMode: String,
                  hasGyroscope: Boolean,
                  onProgress: (Int) -> Unit = {}
              ): File {
                  require(frames.size >= MIN_FRAMES) { "Need at least $MIN_FRAMES frames" }
                  val sorted = frames.sortedBy { it.yawDeg }
                  val pano = buildEquirect(sorted, onProgress)
                  onProgress(90)
                  val faces = Array(6) { renderFace(pano, it) }
                  val thumb = Bitmap.createScaledBitmap(faces[FRONT_INDEX], THUMB_SIZE, THUMB_SIZE, true)
                  try {
                      PancoContainer.write(outFile, faces, thumb, buildMeta(sorted, sensorMode, hasGyroscope))
                  } finally {
                      faces.forEach { it.recycle() }
                      thumb.recycle()
                  }
                  onProgress(100)
                  return outFile
              }

              private fun buildEquirect(frames: List<Frame>, onProgress: (Int) -> Unit): IntArray {
                  val n = PANO_W * PANO_H
                  val accR = FloatArray(n)
                  val accG = FloatArray(n)
                  val accB = FloatArray(n)
                  val accW = FloatArray(n)
                  val lon = DoubleArray(PANO_W) { x -> (x + 0.5) / PANO_W * 2.0 * PI - PI }
                  val tanLat = DoubleArray(PANO_H)
                  for (y in 0 until PANO_H) {
                      val lat = (0.5 - (y + 0.5) / PANO_H) * PI
                      tanLat[y] = tan(lat)
                  }
                  val halfH = Math.toRadians(H_FOV_DEG / 2.0)
                  val halfV = Math.toRadians(V_FOV_DEG / 2.0)
                  val fx = (FRAME_W / 2.0) / tan(halfH)
                  val fy = (FRAME_H / 2.0) / tan(halfV)
                  val cx = FRAME_W / 2.0
                  val cy = FRAME_H / 2.0
                  val featherK = PI / (2.0 * halfH)

                  frames.forEachIndexed { index, frame ->
                      val pixels = loadFramePixels(frame.file)
                      val yaw = Math.toRadians(frame.yawDeg.toDouble())
                      for (x in 0 until PANO_W) {
                          val d = wrapPi(lon[x] - yaw)
                          if (abs(d) >= halfH) continue
                          val cosD = cos(d)
                          val col = (cx + fx * tan(d)).toInt().coerceIn(0, FRAME_W - 1)
                          val w = cos(d * featherK).toFloat()
                          for (y in 0 until PANO_H) {
                              val srcY = cy - fy * tanLat[y] / cosD
                              if (srcY < 0.0 || srcY >= FRAME_H) continue
                              val c = pixels[srcY.toInt() * FRAME_W + col]
                              val i = y * PANO_W + x
                              accR[i] += ((c shr 16) and 0xFF) * w
                              accG[i] += ((c shr 8) and 0xFF) * w
                              accB[i] += (c and 0xFF) * w
                              accW[i] += w
                          }
                      }
                      onProgress(index * 85 / frames.size)
                  }
                  val out = IntArray(n)
                  for (i in 0 until n) {
                      val w = accW[i]
                      out[i] = if (w > 0f) argb(accR[i] / w, accG[i] / w, accB[i] / w) else OPAQUE_BLACK
                  }
                  fillUncoveredRows(out, accW)
                  return out
              }

              private fun fillUncoveredRows(px: IntArray, weight: FloatArray) {
                  for (x in 0 until PANO_W) {
                      var first = -1
                      var lastRow = -1
                      for (y in 0 until PANO_H) {
                          if (weight[y * PANO_W + x] > 0f) {
                              if (first == -1) first = y
                              lastRow = y
                          }
                      }
                      if (first == -1) continue
                      val topColor = px[first * PANO_W + x]
                      val bottomColor = px[lastRow * PANO_W + x]
                      for (y in 0 until first) px[y * PANO_W + x] = topColor
                      for (y in lastRow + 1 until PANO_H) px[y * PANO_W + x] = bottomColor
                      var last = topColor
                      for (y in first..lastRow) {
                          val i = y * PANO_W + x
                          if (weight[i] > 0f) last = px[i] else px[i] = last
                      }
                  }
              }

              private fun faceDirection(face: Int, u: Double, v: Double, out: DoubleArray) {
                  when (face) {
                      0 -> { out[0] = 1.0;   out[1] = -v;   out[2] = -u }
                      1 -> { out[0] = -1.0;  out[1] = -v;   out[2] = u }
                      2 -> { out[0] = u;     out[1] = 1.0;  out[2] = v }
                      3 -> { out[0] = u;     out[1] = -1.0; out[2] = -v }
                      4 -> { out[0] = u;     out[1] = -v;   out[2] = 1.0 }
                      else -> { out[0] = -u; out[1] = -v;   out[2] = -1.0 }
                  }
              }

              private fun renderFace(pano: IntArray, face: Int): Bitmap {
                  val n = FACE_SIZE
                  val pixels = IntArray(n * n)
                  val dir = DoubleArray(3)
                  for (j in 0 until n) {
                      val v = 2.0 * (j + 0.5) / n - 1.0
                      for (i in 0 until n) {
                          val u = 2.0 * (i + 0.5) / n - 1.0
                          faceDirection(face, u, v, dir)
                          val len = sqrt(dir[0] * dir[0] + dir[1] * dir[1] + dir[2] * dir[2])
                          val lon = atan2(dir[0], -dir[2])
                          val lat = asin((dir[1] / len).coerceIn(-1.0, 1.0))
                          val ex = (lon / (2.0 * PI) + 0.5) * PANO_W - 0.5
                          val ey = (0.5 - lat / PI) * PANO_H - 0.5
                          pixels[j * n + i] = sampleBilinear(pano, ex, ey)
                      }
                  }
                  val bmp = Bitmap.createBitmap(n, n, Bitmap.Config.ARGB_8888)
                  bmp.setPixels(pixels, 0, n, 0, 0, n, n)
                  return bmp
              }

              private fun sampleBilinear(px: IntArray, fx: Double, fy: Double): Int {
                  val x0f = floor(fx)
                  val y0f = floor(fy)
                  val tx = (fx - x0f).toFloat()
                  val ty = (fy - y0f).toFloat()
                  val x0 = Math.floorMod(x0f.toInt(), PANO_W)
                  val x1 = Math.floorMod(x0f.toInt() + 1, PANO_W)
                  val y0 = y0f.toInt().coerceIn(0, PANO_H - 1)
                  val y1 = (y0f.toInt() + 1).coerceIn(0, PANO_H - 1)
                  val c00 = px[y0 * PANO_W + x0]
                  val c10 = px[y0 * PANO_W + x1]
                  val c01 = px[y1 * PANO_W + x0]
                  val c11 = px[y1 * PANO_W + x1]
                  return argb(
                      mix(chan(c00, 16), chan(c10, 16), chan(c01, 16), chan(c11, 16), tx, ty),
                      mix(chan(c00, 8), chan(c10, 8), chan(c01, 8), chan(c11, 8), tx, ty),
                      mix(chan(c00, 0), chan(c10, 0), chan(c01, 0), chan(c11, 0), tx, ty)
                  )
              }

              private fun loadFramePixels(file: File): IntArray {
                  var bmp = BitmapFactory.decodeFile(file.absolutePath, BitmapFactory.Options().apply {
                      inPreferredConfig = Bitmap.Config.ARGB_8888
                  }) ?: throw IllegalStateException("Unreadable frame ${file.name}")
                  if (bmp.width != FRAME_W || bmp.height != FRAME_H) {
                      val scaled = Bitmap.createScaledBitmap(bmp, FRAME_W, FRAME_H, true)
                      bmp.recycle()
                      bmp = scaled
                  }
                  val px = IntArray(FRAME_W * FRAME_H)
                  bmp.getPixels(px, 0, FRAME_W, 0, 0, FRAME_W, FRAME_H)
                  bmp.recycle()
                  return px
              }

              private fun buildMeta(frames: List<Frame>, sensorMode: String, hasGyro: Boolean): JSONObject {
                  val frameArray = JSONArray()
                  frames.forEachIndexed { i, f ->
                      frameArray.put(
                          JSONObject()
                              .put("index", i)
                              .put("yawDeg", f.yawDeg.toDouble())
                              .put("file", f.file.name)
                      )
                  }
                  return JSONObject()
                      .put("format", "panco")
                      .put("formatVersion", 2)
                      .put("faceOrder", JSONArray(PancoContainer.FACE_NAMES.toList()))
                      .put("faceSize", FACE_SIZE)
                      .put("panorama", JSONObject().put("width", PANO_W).put("height", PANO_H))
                      .put("hFovDeg", H_FOV_DEG)
                      .put("vFovDeg", V_FOV_DEG)
                      .put("sensorMode", sensorMode)
                      .put("hasGyroscope", hasGyro)
                      .put("createdAtMs", System.currentTimeMillis())
                      .put("frames", frameArray)
              }

              private fun wrapPi(a: Double): Double {
                  var x = (a + PI) % (2.0 * PI)
                  if (x < 0) x += 2.0 * PI
                  return x - PI
              }

              private fun argb(r: Float, g: Float, b: Float): Int =
                  OPAQUE_BLACK or
                      (r.toInt().coerceIn(0, 255) shl 16) or
                      (g.toInt().coerceIn(0, 255) shl 8) or
                      b.toInt().coerceIn(0, 255)

              private fun chan(c: Int, shift: Int): Float = ((c shr shift) and 0xFF).toFloat()

              private fun mix(a: Float, b: Float, c: Float, d: Float, tx: Float, ty: Float): Float {
                  val top = a + (b - a) * tx
                  val bottom = c + (d - c) * tx
                  return top + (bottom - top) * ty
              }
          }
          EOF

          cat > $SRC/PancoContainer.kt <<'EOF'
          package com.zeeshan.cameraapp

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.util.zip.ZipEntry
          import java.util.zip.ZipFile
          import java.util.zip.ZipOutputStream

          object PancoContainer {
              const val EXT = "panco"
              val FACE_NAMES: Array<String> = arrayOf(
                  "right.png", "left.png", "top.png", "bottom.png", "back.png", "front.png"
              )
              private const val THUMB_ENTRY = "thumb.jpg"
              private const val META_ENTRY = "meta.json"

              fun dir(context: Context): File = File(context.filesDir, "panco").apply { mkdirs() }

              fun listNewestFirst(context: Context): List<File> =
                  dir(context)
                      .listFiles { f -> f.isFile && f.extension == EXT }
                      ?.sortedByDescending { it.lastModified() }
                      ?: emptyList()

              fun write(out: File, faces: Array<Bitmap>, thumb: Bitmap, meta: JSONObject) {
                  require(faces.size == FACE_NAMES.size) { "Expected ${FACE_NAMES.size} faces" }
                  val tmp = File(out.parentFile, out.name + ".tmp")
                  ZipOutputStream(FileOutputStream(tmp).buffered()).use { zip ->
                      faces.forEachIndexed { i, bmp ->
                          zip.putNextEntry(ZipEntry(FACE_NAMES[i]))
                          bmp.compress(Bitmap.CompressFormat.PNG, 100, zip)
                          zip.closeEntry()
                      }
                      zip.putNextEntry(ZipEntry(THUMB_ENTRY))
                      thumb.compress(Bitmap.CompressFormat.JPEG, 85, zip)
                      zip.closeEntry()
                      zip.putNextEntry(ZipEntry(META_ENTRY))
                      zip.write(meta.toString(2).toByteArray(Charsets.UTF_8))
                      zip.closeEntry()
                  }
                  check(tmp.renameTo(out)) { "Could not finalise ${out.name}" }
              }

              fun readThumb(file: File, sampleSize: Int): Bitmap? {
                  ZipFile(file).use { zf ->
                      val entry = zf.getEntry(THUMB_ENTRY) ?: return null
                      val opts = BitmapFactory.Options().apply {
                          inSampleSize = sampleSize
                          inPreferredConfig = Bitmap.Config.RGB_565
                      }
                      return zf.getInputStream(entry).use { BitmapFactory.decodeStream(it, null, opts) }
                  }
              }

              fun readFaces(file: File, config: Bitmap.Config): Array<Bitmap> {
                  ZipFile(file).use { zf ->
                      return Array(FACE_NAMES.size) { i ->
                          val name = FACE_NAMES[i]
                          val entry = zf.getEntry(name) ?: throw IllegalStateException("Missing $name")
                          val opts = BitmapFactory.Options().apply { inPreferredConfig = config }
                          zf.getInputStream(entry).use { BitmapFactory.decodeStream(it, null, opts) }
                              ?: throw IllegalStateException("Corrupt $name")
                      }
                  }
              }
          }
