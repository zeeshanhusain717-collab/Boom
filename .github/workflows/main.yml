          package com.zeeshan.cameraapp

          import android.content.Context
          import android.content.pm.PackageManager
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import kotlin.math.atan2

          class PoseTracker(context: Context, private val listener: Listener) : SensorEventListener {
              interface Listener {
                  fun onYaw(yawDeg: Float)
                  fun onTilt(tiltDeg: Float)
              }

              private val sensorManager = context.getSystemService(Context.SENSOR_SERVICE) as SensorManager
              private val rotationSensor: android.hardware.Sensor? =
                  sensorManager.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR)
              private val accelSensor: android.hardware.Sensor? =
                  sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)
              private val gyroPresent =
                  context.packageManager.hasSystemFeature(PackageManager.FEATURE_SENSOR_GYROSCOPE)

              val hasHeading: Boolean get() = rotationSensor != null
              val hasGyroscope: Boolean get() = gyroPresent

              private val rotationMatrix = FloatArray(9)
              private val remapped = FloatArray(9)
              private val orientation = FloatArray(3)
              private var startAzimuth: Float? = null

              fun start() {
                  rotationSensor?.let { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME) }
                  accelSensor?.let { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_UI) }
              }

              fun stop() {
                  sensorManager.unregisterListener(this)
                  startAzimuth = null
              }

              fun resetHeading() {
                  startAzimuth = null
              }

              override fun onSensorChanged(event: SensorEvent) {
                  when (event.sensor.type) {
                      Sensor.TYPE_ROTATION_VECTOR -> {
                          SensorManager.getRotationMatrixFromVector(rotationMatrix, event.values)
                          SensorManager.remapCoordinateSystem(
                              rotationMatrix, SensorManager.AXIS_X, SensorManager.AXIS_Z, remapped
                          )
                          SensorManager.getOrientation(remapped, orientation)
                          val azimuth = orientation[0]
                          val start = startAzimuth ?: azimuth.also { startAzimuth = it }
                          var relDeg = Math.toDegrees((azimuth - start).toDouble()).toFloat()
                          relDeg = ((relDeg % 360f) + 360f) % 360f
                          listener.onYaw(relDeg)
                      }
                      Sensor.TYPE_ACCELEROMETER -> {
                          val ax = event.values[0].toDouble()
                          val ay = event.values[1].toDouble()
                          listener.onTilt(Math.toDegrees(atan2(ax, ay)).toFloat())
                      }
                  }
              }

              override fun onAccuracyChanged(sensor: android.hardware.Sensor?, accuracy: Int) = Unit
          }
