                  android:paddingHorizontal="32dp" android:paddingVertical="16dp" android:visibility="gone"
                  android:elevation="10dp" android:gravity="center">
                  <TextView android:id="@+id/hud_text" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="#FFFFFF" android:textSize="20sp" android:textStyle="bold"/>
              </LinearLayout>
              
              <ImageButton
                  android:id="@+id/btn_unlock" android:layout_width="72dp" android:layout_height="72dp"
                  android:layout_centerVertical="true" android:layout_alignParentStart="true" android:layout_marginStart="32dp"
                  android:background="@drawable/bg_3d_pill" android:src="@android:drawable/ic_secure"
                  android:tint="#FFFFFF" android:visibility="gone" android:elevation="12dp" android:padding="16dp"/>
          </RelativeLayout>
          EOF

          cat > app/src/main/res/layout/exo_player_control_view.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/control_root" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#1A000000">
