      - name: Write Kotlin Source Code
        run: |
          cat > app/src/main/java/com/zeeshan/videopyle/MainActivity.kt <<'EOF'
          package com.zeeshan.videopyle

          import android.Manifest
          import android.content.ContentUris
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.bumptech.glide.Glide
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.util.concurrent.TimeUnit

          data class VideoModel(val id: Long, val title: String, val path: String, val duration: Long, val size: Long, val uri: Uri, val folderName: String)

          class MainActivity : AppCompatActivity() {
              private lateinit var recyclerView: RecyclerView
              private lateinit var tabFolders: TextView
              private lateinit var tabVideos: TextView
              
              private var videoList = ArrayList<VideoModel>()
              private var folderList = ArrayList<Pair<String, ArrayList<VideoModel>>>()
              private var isFolderTab = true

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tabFolders = findViewById(R.id.tab_folders)
                  tabVideos = findViewById(R.id.tab_videos)
                  recyclerView = findViewById(R.id.recycler_view)
                  recyclerView.layoutManager = LinearLayoutManager(this)

                  tabFolders.setOnClickListener { switchTab(true) }
                  tabVideos.setOnClickListener { switchTab(false) }
              }

              override fun onResume() { super.onResume(); checkPermissions() }

              private fun switchTab(isFolder: Boolean) {
                  isFolderTab = isFolder
                  tabFolders.setTextColor(if (isFolder) Color.WHITE else Color.parseColor("#D7CCC8"))
                  tabVideos.setTextColor(if (!isFolder) Color.WHITE else Color.parseColor("#D7CCC8"))
                  setupAdapter()
              }

              private fun checkPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          AlertDialog.Builder(this).setTitle("Storage Access")
                              .setMessage("Require full storage access to play offline videos.")
                              .setPositiveButton("Grant") { _, _ -> startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:$packageName"))) }
                              .show()
                      } else fetchVideosAsync()
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_MEDIA_VIDEO), 101)
                      } else fetchVideosAsync()
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE), 101)
                      } else fetchVideosAsync()
                  }
              }

              private fun fetchVideosAsync() {
                  lifecycleScope.launch {
                      withContext(Dispatchers.IO) {
                          videoList.clear()
                          val fMap = HashMap<String, ArrayList<VideoModel>>()
                          val proj = arrayOf(MediaStore.Video.Media._ID, MediaStore.Video.Media.TITLE, MediaStore.Video.Media.DATA, MediaStore.Video.Media.DURATION, MediaStore.Video.Media.SIZE)
                          contentResolver.query(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, proj, null, null, "${MediaStore.Video.Media.DATE_ADDED} DESC")?.use {
                              while (it.moveToNext()) {
                                  val id = it.getLong(0)
                                  val path = it.getString(2) ?: ""
                                  val model = VideoModel(id, it.getString(1) ?: "Video", path, it.getLong(3), it.getLong(4),
                                      ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id), File(path).parentFile?.name ?: "Internal Storage")
                                  videoList.add(model)
                                  fMap.getOrPut(model.folderName) { ArrayList() }.add(model)
                              }
                          }
                          folderList.clear()
                          folderList.addAll(fMap.toList())
                      }
                      setupAdapter()
                  }
              }

              private fun setupAdapter() {
                  recyclerView.adapter = object : RecyclerView.Adapter<RecyclerView.ViewHolder>() {
                      override fun getItemViewType(position: Int) = if (isFolderTab) 0 else 1
                      override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): RecyclerView.ViewHolder {
                          val view = LinearLayout(this@MainActivity).apply {
                              orientation = LinearLayout.HORIZONTAL; setPadding(30, 30, 30, 30)
                              layoutParams = RecyclerView.LayoutParams(-1, -2).apply { setMargins(16, 16, 16, 16) }
                              background = ContextCompat.getDrawable(this@MainActivity, android.R.drawable.dialog_holo_light_frame)
                          }
                          val tvMain = TextView(this@MainActivity).apply { textSize = 16f; setTextColor(Color.BLACK); layoutParams = LinearLayout.LayoutParams(0, -2, 1f) }
                          view.addView(tvMain)
                          return object : RecyclerView.ViewHolder(view) {}
                      }
                      override fun onBindViewHolder(holder: RecyclerView.ViewHolder, position: Int) {
                          val container = holder.itemView as LinearLayout
                          val tvMain = container.getChildAt(0) as TextView
                          if (isFolderTab) {
                              val folder = folderList[position]
                              tvMain.text = "📁 ${folder.first}\n${folder.second.size} videos"
                              container.setOnClickListener { showFolderDialog(folder.first, folder.second) }
                          } else {
                              val video = videoList[position]
                              tvMain.text = "🎬 ${video.title}\n${String.format("%.1f MB", video.size.toDouble() / (1024 * 1024))}"
                              container.setOnClickListener { launchPlayer(video) }
                          }
                      }
                      override fun getItemCount() = if (isFolderTab) folderList.size else videoList.size
                  }
              }

              private fun showFolderDialog(name: String, list: ArrayList<VideoModel>) {
                  val listView = ListView(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_list_item_1, list.map { it.title })
                      setOnItemClickListener { _, _, i, _ -> launchPlayer(list[i]) }
                  }
                  AlertDialog.Builder(this).setTitle(name).setView(listView).setNegativeButton("Close", null).show()
              }

              private fun launchPlayer(v: VideoModel) {
                  startActivity(Intent(this, PlayerActivity::class.java).apply {
                      putExtra("video_uri", v.uri.toString())
                      putExtra("video_title", v.title)
                  })
              }
          }
          EOF

          cat > app/src/main/java/com/zeeshan/videopyle/PlayerActivity.kt <<'EOF'
          package com.zeeshan.videopyle

          import android.content.Context
          import android.content.pm.ActivityInfo
          import android.media.AudioManager
          import android.media.audiofx.LoudnessEnhancer
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.Window
          import android.view.WindowManager
          import android.widget.ImageButton
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackParameters
          import androidx.media3.common.TrackSelectionOverride
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView
          import kotlin.math.abs

          class PlayerActivity : AppCompatActivity() {
              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView
              private lateinit var hudLayout: LinearLayout
              private lateinit var hudText: TextView
              private lateinit var btnUnlock: ImageButton
              
              private var loudnessEnhancer: LoudnessEnhancer? = null
              private var currentBoostPercent = 100
              private var currentSpeed = 1.0f
              private var isLocked = false
              private var isPillVisible = true
              
              private var scaleFactor = 1.0f
              private lateinit var scaleDetector: ScaleGestureDetector
              private lateinit var gestureDetector: GestureDetector

              private var videoUriStr: String? = null
              private var currentAspectMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
              private val hideHudHandler = Handler(Looper.getMainLooper())
              private val hideHudRunnable = Runnable { hudLayout.visibility = View.GONE }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestWindowFeature(Window.FEATURE_NO_TITLE)
                  window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).let {
                      it.hide(WindowInsetsCompat.Type.systemBars())
                      it.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }

                  setContentView(R.layout.activity_player)
                  videoUriStr = intent.getStringExtra("video_uri")
                  
                  playerView = findViewById(R.id.player_view)
                  hudLayout = findViewById(R.id.hud_layout)
                  hudText = findViewById(R.id.hud_text)
                  btnUnlock = findViewById(R.id.btn_unlock)

                  setupControls()
                  setupGestures()
                  initPlayer()
              }

              private fun setupControls() {
                  findViewById<TextView>(R.id.tv_title)?.text = intent.getStringExtra("video_title") ?: "Video"
                  findViewById<ImageButton>(R.id.btn_back)?.setOnClickListener { finish() }
                  findViewById<TextView>(R.id.btn_top_speed)?.setOnClickListener {
                      val speeds = arrayOf(0.5f, 1.0f, 1.5f, 2.0f)
                      currentSpeed = speeds[(speeds.indexOf(currentSpeed) + 1) % speeds.size]
                      player?.playbackParameters = PlaybackParameters(currentSpeed)
                      (it as TextView).text = "${currentSpeed}x"
                      showHud("Speed: ${currentSpeed}x")
                  }
                  
                  findViewById<TextView>(R.id.btn_aspect_ratio)?.setOnClickListener {
                      currentAspectMode = if (currentAspectMode == AspectRatioFrameLayout.RESIZE_MODE_FIT) AspectRatioFrameLayout.RESIZE_MODE_ZOOM else AspectRatioFrameLayout.RESIZE_MODE_FIT
                      playerView.resizeMode = currentAspectMode
                      showHud(if (currentAspectMode == AspectRatioFrameLayout.RESIZE_MODE_FIT) "FIT" else "CROP")
                  }

                  val pill = findViewById<LinearLayout>(R.id.floating_pill)
                  findViewById<TextView>(R.id.pill_collapse)?.setOnClickListener {
                      isPillVisible = !isPillVisible
                      pill.visibility = if (isPillVisible) View.VISIBLE else View.GONE
                  }
                  findViewById<TextView>(R.id.pill_rotate)?.setOnClickListener {
                      requestedOrientation = if (requestedOrientation == ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE) ActivityInfo.SCREEN_ORIENTATION_PORTRAIT else ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                  }
                  findViewById<TextView>(R.id.pill_boost)?.setOnClickListener {
                      currentBoostPercent = if (currentBoostPercent == 100) 200 else 100
                      applyAudioBoost(currentBoostPercent)
                      showHud("Audio Boost: $currentBoostPercent%")
                  }

                  val rootControl = findViewById<View>(R.id.control_root)
                  findViewById<ImageButton>(R.id.btn_lock)?.setOnClickListener {
                      isLocked = true; playerView.useController = false; rootControl.visibility = View.GONE; btnUnlock.visibility = View.VISIBLE
                      showHud("Locked 🔒")
                  }
                  btnUnlock.setOnClickListener {
                      isLocked = false; playerView.useController = true; btnUnlock.visibility = View.GONE
                      showHud("Unlocked 🔓")
                  }
              }

              private fun setupGestures() {
                  scaleDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScale(d: ScaleGestureDetector): Boolean {
                          if (isLocked) return false
                          scaleFactor = (scaleFactor * d.scaleFactor).coerceIn(1.0f, 3.0f)
                          playerView.videoSurfaceView?.apply { scaleX = scaleFactor; scaleY = scaleFactor }
                          if(scaleFactor > 1.0f) showHud("Zoom: ${(scaleFactor*100).toInt()}%")
                          return true
                      }
                  })

                  gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onScroll(e1: MotionEvent?, e2: MotionEvent, dX: Float, dY: Float): Boolean {
                          if (e1 == null || isLocked) return false
                          if (abs(dX) > abs(dY)) { // Seek (Math Type Mismatch Fixed Here)
                              player?.let { p ->
                                  val offset = (dX * 150f).toLong()
                                  val newPos = (p.currentPosition - offset).coerceIn(0L, p.duration)
                                  p.seekTo(newPos)
                                  showHud(String.format("%02d:%02d", (newPos/1000)/60, (newPos/1000)%60))
                              }
                          } else { // Volume/Brightness
                              if (e1.x < resources.displayMetrics.widthPixels / 2) {
                                  val lp = window.attributes
                                  lp.screenBrightness = (lp.screenBrightness + dY / resources.displayMetrics.heightPixels).coerceIn(0.01f, 1.0f)
                                  window.attributes = lp
                                  showHud("☀️ ${(lp.screenBrightness * 100).toInt()}%")
                              } else {
                                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                                  if (dY > 0) am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, 0)
                                  else am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, 0)
                                  val max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                                  showHud("🔊 ${(am.getStreamVolume(AudioManager.STREAM_MUSIC).toFloat() / max * 100).toInt()}%")
                              }
                          }
                          return true
                      }
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          if (!isLocked) { if (playerView.isControllerFullyVisible) playerView.hideController() else playerView.showController() }
                          return true
                      }
                  })

                  playerView.setOnTouchListener { _, event ->
                      if (isLocked) true else {
                          scaleDetector.onTouchEvent(event)
                          gestureDetector.onTouchEvent(event)
                          true 
                      }
                  }
              }

              private fun showHud(t: String) {
                  hudText.text = t; hudLayout.visibility = View.VISIBLE
                  hideHudHandler.removeCallbacks(hideHudRunnable)
                  hideHudHandler.postDelayed(hideHudRunnable, 1500)
              }

              private fun applyAudioBoost(p: Int) {
                  if (player?.audioSessionId == C.AUDIO_SESSION_ID_UNSET) return
                  loudnessEnhancer = loudnessEnhancer ?: LoudnessEnhancer(player!!.audioSessionId)
                  if (p > 100) { loudnessEnhancer?.setTargetGain((p - 100) * 15); loudnessEnhancer?.enabled = true }
                  else loudnessEnhancer?.enabled = false
              }

              private fun initPlayer() {
                  if (videoUriStr == null) return
                  player = ExoPlayer.Builder(this).build().apply {
                      playerView.player = this
                      setMediaItem(MediaItem.fromUri(Uri.parse(videoUriStr)))
                      val pos = getSharedPreferences("Prefs", MODE_PRIVATE).getLong(videoUriStr, 0L)
                      if (pos > 0) seekTo(pos)
                      prepare(); playWhenReady = true
                  }
              }

              override fun onStop() {
                  super.onStop()
                  player?.let { p ->
                      getSharedPreferences("Prefs", MODE_PRIVATE).edit().putLong(videoUriStr, p.currentPosition).apply()
                      p.release()
                  }
                  loudnessEnhancer?.release(); player = null
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zeeshan-Vedio-Pyle-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
