                  <ImageButton android:id="@+id/btn_lock" android:layout_width="40dp" android:layout_height="40dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_secure" android:tint="#FFFFFF" android:layout_marginEnd="8dp"/>
