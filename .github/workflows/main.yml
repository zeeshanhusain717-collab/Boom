                  <TextView android:id="@+id/btn_audio_track" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🎵" android:textSize="22sp" android:padding="8dp"/>
                  <TextView android:id="@+id/btn_subtitle" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="💬" android:textSize="22sp" android:padding="8dp"/>
                  <TextView android:id="@+id/btn_decoder" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="HW"
                      android:textColor="#FFFFFF" android:textSize="14sp" android:textStyle="bold" android:background="@drawable/bg_3d_button" android:padding="8dp" android:layout_marginStart="8dp"/>
                  <TextView android:id="@+id/btn_top_speed" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="1.0x"
                      android:textColor="#FFFFFF" android:textSize="14sp" android:textStyle="bold" android:background="@drawable/bg_3d_button" android:padding="8dp" android:layout_marginStart="8dp"/>
              </LinearLayout>

              <LinearLayout android:id="@+id/floating_pill" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_below="@id/top_bar" android:layout_centerHorizontal="true" android:layout_marginTop="16dp"
                  android:background="@drawable/bg_3d_pill" android:padding="8dp" android:gravity="center">
                  <TextView android:id="@+id/pill_boost" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🎧" android:textSize="20sp" android:padding="12dp"/>
                  <TextView android:id="@+id/pill_rotate" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔄" android:textSize="20sp" android:padding="12dp"/>
                  <TextView android:id="@+id/pill_collapse" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text=">" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="18sp" android:padding="12dp"/>
              </LinearLayout>

              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_centerInParent="true">
                  <ImageButton android:id="@id/exo_prev" android:layout_width="64dp" android:layout_height="64dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_media_previous" android:tint="#FFFFFF"/>
                  <ImageButton android:id="@id/exo_play_pause" android:layout_width="80dp" android:layout_height="80dp" android:layout_marginHorizontal="32dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_media_play" android:tint="#FFFFFF"/>
                  <ImageButton android:id="@id/exo_next" android:layout_width="64dp" android:layout_height="64dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@android:drawable/ic_media_next" android:tint="#FFFFFF"/>
