name: Build Zeeshan Vedio Pyle APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pure Offline Video Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/videopyle
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # gradle.properties
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          # settings.gradle
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanVedioPyle"
          include(":app")
          EOF

          # Root build.gradle
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          # App build.gradle (Includes Google Media3 ExoPlayer Engine)
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.videopyle"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.videopyle"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { 
                  release { 
                      minifyEnabled false 
                  } 
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.constraintlayout:constraintlayout:2.1.4"
              
              // Google ExoPlayer (Media3 Engine) - Pure Offline Version
              implementation "androidx.media3:media3-exoplayer:1.3.1"
              implementation "androidx.media3:media3-ui:1.3.1"
              implementation "androidx.media3:media3-common:1.3.1"
              
              // Glide for Video Thumbnails
              implementation "com.github.bumptech.glide:glide:4.16.0"
          }
          EOF

      - name: Generate App Resources & Manifest
        run: |
          set -euo pipefail

          # strings.xml
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zeeshan vedio pyle</string>
          </resources>
          EOF

          # MX Blue Vector Icon
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="512dp"
              android:height="512dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path android:pathData="M256,0 C114.6,0 0,114.6 0,256 C0,397.4 114.6,512 256,512 C397.4,512 512,397.4 512,256 C512,114.6 397.4,0 256,0 Z" android:fillColor="#0084FF"/>
              <path android:pathData="M200,150 L360,256 L200,362 Z" android:fillColor="#FFFFFF"/>
          </vector>
          EOF

          # AndroidManifest.xml (INTERNET removed, backup disabled for privacy/offline mode)
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              
              <!-- Pure Offline Permissions -->
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

              <!-- allowBackup="false" ensures no data goes to Gmail/Google Drive -->
              <application
                  android:allowBackup="false" 
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout"
                      android:theme="@style/Theme.AppCompat.NoActionBar"/>
              </application>
          </manifest>
          EOF

      - name: Write Kotlin Source Code (MainActivity & PlayerActivity)
        run: |
          cat > app/src/main/java/com/zeeshan/videopyle/MainActivity.kt <<'EOF'
          package com.zeeshan.videopyle

          import android.Manifest
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.bumptech.glide.Glide
          import java.io.File
          import java.util.concurrent.TimeUnit

          data class VideoModel(
              val id: Long,
              val title: String,
              val path: String,
              val duration: Long,
              val size: Long,
              val uri: Uri,
              val folderName: String
          )

          class MainActivity : AppCompatActivity() {

              private lateinit var mainContainer: LinearLayout
              private lateinit var videoListView: LinearLayout
              private lateinit var tabFoldersBtn: TextView
              private lateinit var tabVideosBtn: TextView
              
              private val videoList = ArrayList<VideoModel>()
              private val folderMap = HashMap<String, ArrayList<VideoModel>>()
              private var currentTabIsFolders = true

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // App Background Color (MX Style Light Gray)
                  mainContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#F5F6F8"))
                      layoutParams = ViewGroup.LayoutParams(-1, -1)
                  }

                  // Header (MX Player Blue)
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(40, 40, 40, 40)
                      setBackgroundColor(Color.parseColor("#0084FF"))
                      elevation = 8f
                  }

                  val titleTv = TextView(this).apply {
                      text = "Zeeshan vedio pyle"
                      textSize = 22f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }

                  header.addView(titleTv)

                  // Tabs Bar (MX Style)
                  val tabBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#0084FF"))
                  }

                  tabFoldersBtn = TextView(this).apply {
                      text = "FOLDERS"
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 30, 0, 30)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                      setOnClickListener {
                          currentTabIsFolders = true
                          updateTabUI()
                          renderView()
                      }
                  }

                  tabVideosBtn = TextView(this).apply {
                      text = "ALL VIDEOS"
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#B3E5FC"))
                      gravity = Gravity.CENTER
                      setPadding(0, 30, 0, 30)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                      setOnClickListener {
                          currentTabIsFolders = false
                          updateTabUI()
                          renderView()
                      }
                  }

                  tabBar.addView(tabFoldersBtn)
                  tabBar.addView(tabVideosBtn)

                  val scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)
                  }

                  videoListView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 20, 20, 20)
                  }

                  scrollView.addView(videoListView)

                  mainContainer.addView(header)
                  mainContainer.addView(tabBar)
                  mainContainer.addView(scrollView)

                  setContentView(mainContainer)

                  checkPermissionsAndLoad()
              }

              private fun updateTabUI() {
                  if (currentTabIsFolders) {
                      tabFoldersBtn.setTextColor(Color.WHITE)
                      tabVideosBtn.setTextColor(Color.parseColor("#B3E5FC"))
                  } else {
                      tabFoldersBtn.setTextColor(Color.parseColor("#B3E5FC"))
                      tabVideosBtn.setTextColor(Color.WHITE)
                  }
              }

              private fun checkPermissionsAndLoad() {
                  val permission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      Manifest.permission.READ_MEDIA_VIDEO
                  } else {
                      Manifest.permission.READ_EXTERNAL_STORAGE
                  }

                  if (ContextCompat.checkSelfPermission(this, permission) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(permission), 101)
                  } else {
                      loadLocalVideos()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 101 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      loadLocalVideos()
                  } else {
                      Toast.makeText(this, "Permission required to scan offline videos!", Toast.LENGTH_LONG).show()
                  }
              }

              private fun loadLocalVideos() {
                  videoList.clear()
                  folderMap.clear()

                  val projection = arrayOf(
                      MediaStore.Video.Media._ID,
                      MediaStore.Video.Media.TITLE,
                      MediaStore.Video.Media.DATA,
                      MediaStore.Video.Media.DURATION,
                      MediaStore.Video.Media.SIZE
                  )

                  val cursor = contentResolver.query(
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                      projection, null, null,
                      "${MediaStore.Video.Media.DATE_ADDED} DESC"
                  )

                  cursor?.use {
                      val idCol = it.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                      val titleCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.TITLE)
                      val pathCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.DATA)
                      val durCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                      val sizeCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)

                      while (it.moveToNext()) {
                          val id = it.getLong(idCol)
                          val title = it.getString(titleCol) ?: "Video"
                          val path = it.getString(pathCol) ?: ""
                          val duration = it.getLong(durCol)
                          val size = it.getLong(sizeCol)
                          val uri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)

                          val folder = File(path).parentFile?.name ?: "Internal Memory"
                          val model = VideoModel(id, title, path, duration, size, uri, folder)

                          videoList.add(model)

                          if (!folderMap.containsKey(folder)) {
                              folderMap[folder] = ArrayList()
                          }
                          folderMap[folder]?.add(model)
                      }
                  }

                  renderView()
              }

              private fun renderView() {
                  videoListView.removeAllViews()

                  if (currentTabIsFolders) {
                      for ((folderName, list) in folderMap) {
                          renderFolderCard(folderName, list.size) {
                              showFolderVideosDialog(folderName, list)
                          }
                      }
                  } else {
                      for (video in videoList) {
                          renderVideoCard(video)
                      }
                  }
              }

              private fun renderFolderCard(name: String, count: Int, onClick: () -> Unit) {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(40, 40, 40, 40)
                      elevation = 2f
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 12f
                      }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 15) }
                      setOnClickListener { onClick() }
                  }

                  val icon = TextView(this).apply {
                      text = "📁"
                      textSize = 35f
                      setPadding(0, 0, 40, 0)
                  }

                  val details = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }

                  val titleTv = TextView(this).apply {
                      text = name
                      textSize = 17f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#1A1A1A"))
                  }

                  val countTv = TextView(this).apply {
                      text = "$count videos"
                      textSize = 14f
                      setTextColor(Color.parseColor("#757575"))
                      setPadding(0, 5, 0, 0)
                  }

                  details.addView(titleTv)
                  details.addView(countTv)

                  card.addView(icon)
                  card.addView(details)

                  videoListView.addView(card)
              }

              private fun renderVideoCard(video: VideoModel) {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(20, 20, 20, 20)
                      elevation = 2f
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 12f
                      }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 15) }
                      setOnClickListener {
                          val intent = Intent(this@MainActivity, PlayerActivity::class.java).apply {
                              putExtra("video_uri", video.uri.toString())
                              putExtra("video_title", video.title)
                          }
                          startActivity(intent)
                      }
                  }

                  val thumbContainer = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(240, 150).apply { setMargins(0, 0, 30, 0) }
                  }

                  val thumbIv = ImageView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                      scaleType = ImageView.ScaleType.CENTER_CROP
                  }
                  Glide.with(this).load(video.uri).into(thumbIv)

                  val durationTv = TextView(this).apply {
                      text = formatDuration(video.duration)
                      textSize = 10f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#80000000"))
                      setPadding(8, 4, 8, 4)
                      layoutParams = FrameLayout.LayoutParams(-2, -2).apply {
                          gravity = Gravity.BOTTOM or Gravity.END
                          setMargins(0, 0, 8, 8)
                      }
                  }

                  thumbContainer.addView(thumbIv)
                  thumbContainer.addView(durationTv)

                  val details = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }

                  val titleTv = TextView(this).apply {
                      text = video.title
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#1A1A1A"))
                      maxLines = 2
                  }

                  val sizeTv = TextView(this).apply {
                      text = formatSize(video.size)
                      textSize = 13f
                      setTextColor(Color.parseColor("#0084FF"))
                      setPadding(0, 10, 0, 0)
                  }

                  details.addView(titleTv)
                  details.addView(sizeTv)

                  card.addView(thumbContainer)
                  card.addView(details)

                  videoListView.addView(card)
              }

              private fun showFolderVideosDialog(folderName: String, list: ArrayList<VideoModel>) {
                  val dialog = android.app.Dialog(this, android.R.style.Theme_Light_NoTitleBar_Fullscreen)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#F5F6F8"))
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(40, 40, 40, 40)
                      setBackgroundColor(Color.parseColor("#0084FF"))
                  }

                  val backBtn = TextView(this).apply {
                      text = "←"
                      textSize = 26f
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 40, 0)
                      setOnClickListener { dialog.dismiss() }
                  }

                  val titleTv = TextView(this).apply {
                      text = folderName
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                  }

                  header.addView(backBtn)
                  header.addView(titleTv)

                  val scrollView = ScrollView(this)
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 20, 20, 20)
                  }

                  for (v in list) {
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(20, 20, 20, 20)
                          elevation = 2f
                          background = GradientDrawable().apply {
                              setColor(Color.WHITE)
                              cornerRadius = 12f
                          }
                          layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 15) }
                          setOnClickListener {
                              dialog.dismiss()
                              val intent = Intent(this@MainActivity, PlayerActivity::class.java).apply {
                                  putExtra("video_uri", v.uri.toString())
                                  putExtra("video_title", v.title)
                              }
                              startActivity(intent)
                          }
                      }

                      val thumbContainer = FrameLayout(this).apply {
                          layoutParams = LinearLayout.LayoutParams(240, 150).apply { setMargins(0, 0, 30, 0) }
                      }

                      val thumbIv = ImageView(this).apply {
                          layoutParams = FrameLayout.LayoutParams(-1, -1)
                          scaleType = ImageView.ScaleType.CENTER_CROP
                      }
                      Glide.with(this).load(v.uri).into(thumbIv)

                      val durationTv = TextView(this).apply {
                          text = formatDuration(v.duration)
                          textSize = 10f
                          setTextColor(Color.WHITE)
                          setBackgroundColor(Color.parseColor("#80000000"))
                          setPadding(8, 4, 8, 4)
                          layoutParams = FrameLayout.LayoutParams(-2, -2).apply {
                              gravity = Gravity.BOTTOM or Gravity.END
                              setMargins(0, 0, 8, 8)
                          }
                      }

                      thumbContainer.addView(thumbIv)
                      thumbContainer.addView(durationTv)

                      val details = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                      }

                      val tTv = TextView(this).apply {
                          text = v.title
                          textSize = 15f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.parseColor("#1A1A1A"))
                          maxLines = 2
                      }

                      val sTv = TextView(this).apply {
                          text = formatSize(v.size)
                          textSize = 13f
                          setTextColor(Color.parseColor("#0084FF"))
                          setPadding(0, 10, 0, 0)
                      }

                      details.addView(tTv)
                      details.addView(sTv)

                      card.addView(thumbContainer)
                      card.addView(details)
                      container.addView(card)
                  }

                  scrollView.addView(container)
                  layout.addView(header)
                  layout.addView(scrollView)

                  dialog.setContentView(layout)
                  dialog.show()
              }

              private fun formatDuration(millis: Long): String {
                  val hrs = TimeUnit.MILLISECONDS.toHours(millis)
                  val mins = TimeUnit.MILLISECONDS.toMinutes(millis) % 60
                  val secs = TimeUnit.MILLISECONDS.toSeconds(millis) % 60
                  return if (hrs > 0) String.format("%02d:%02d:%02d", hrs, mins, secs)
                  else String.format("%02d:%02d", mins, secs)
              }

              private fun formatSize(bytes: Long): String {
                  val mb = bytes.toDouble() / (1024 * 1024)
                  return String.format("%.1f MB", mb)
              }
          }
          EOF

          # Write PlayerActivity.kt (Immersive Google Media3 ExoPlayer Engine)
          cat > app/src/main/java/com/zeeshan/videopyle/PlayerActivity.kt <<'EOF'
          package com.zeeshan.videopyle

          import android.content.Context
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.view.Window
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView

          class PlayerActivity : AppCompatActivity() {

              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView
              private var videoUriStr: String? = null
              private var videoTitle: String? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // Fullscreen Immersive MX Player Mode
                  requestWindowFeature(Window.FEATURE_NO_TITLE)
                  window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  hideSystemUI()

                  videoUriStr = intent.getStringExtra("video_uri")
                  videoTitle = intent.getStringExtra("video_title")

                  val rootLayout = FrameLayout(this).apply {
                      setBackgroundColor(Color.BLACK)
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                  }

                  playerView = PlayerView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                      useController = true
                      // Keep controls auto-hiding like MX Player
                      controllerShowTimeoutMs = 3000
                  }

                  rootLayout.addView(playerView)
                  setContentView(rootLayout)

                  initGoogleExoEngine()
              }

              private fun hideSystemUI() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).let { controller ->
                      controller.hide(WindowInsetsCompat.Type.systemBars())
                      controller.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              private fun initGoogleExoEngine() {
                  if (videoUriStr == null) return

                  player = ExoPlayer.Builder(this).build().also { exo ->
                      playerView.player = exo
                      val mediaItem = MediaItem.fromUri(Uri.parse(videoUriStr))
                      exo.setMediaItem(mediaItem)

                      // Offline Resume Playback System
                      val prefs = getSharedPreferences("OfflineVideoPrefs", Context.MODE_PRIVATE)
                      val savedPos = prefs.getLong(videoUriStr, 0L)
                      if (savedPos > 0) {
                          exo.seekTo(savedPos)
                          Toast.makeText(this, "Resumed from where you left", Toast.LENGTH_SHORT).show()
                      }

                      exo.prepare()
                      exo.playWhenReady = true
                  }
              }

              override fun onStop() {
                  super.onStop()
                  player?.let { exo ->
                      // Save position locally on device ONLY
                      val prefs = getSharedPreferences("OfflineVideoPrefs", Context.MODE_PRIVATE)
                      prefs.edit().putLong(videoUriStr, exo.currentPosition).apply()
                      exo.release()
                  }
                  player = null
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zeeshan-Vedio-Pyle-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk

