      # ------------------------------------------------------------------
      - name: Set up Python & Run Auto-Validator Helper
        run: |
          python3 -c "
          import os, sys
          print('🐍 Python Environment Loaded Successfully!')
          print('🔍 Validating project files and structure...')
          required_files = [
              'app/build.gradle',
              'app/src/main/AndroidManifest.xml',
              'app/src/main/java/com/zeeshan/cameraapp/MainActivity.kt',
              'app/src/main/java/com/zeeshan/cameraapp/CubemapProcessor.kt'
          ]
          for f in required_files:
              if os.path.exists(f):
                  print(f'  [OK] Found: {f}')
              else:
                  print(f'  [ERROR] Missing: {f}')
                  sys.exit(1)
          print('✨ All project checks passed via Python helper! Ready for Gradle build.')
          "

      # ------------------------------------------------------------------
      # Step 5: Compile and package
      # ------------------------------------------------------------------
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
