name: Build Zeeshan Vedio Pyle Pro 3D APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pure Offline Advanced 3D Video Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/videopyle
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanVedioPyle"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.videopyle"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.videopyle"
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName "4.0.3D"
              }
              buildTypes { 
                  release { 
                      minifyEnabled false 
                  } 
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.constraintlayout:constraintlayout:2.1.4"
              
              implementation "androidx.media3:media3-exoplayer:1.3.1"
              implementation "androidx.media3:media3-ui:1.3.1"
              implementation "androidx.media3:media3-common:1.3.1"
              
              implementation "com.github.bumptech.glide:glide:4.16.0"
          }
          EOF

      - name: Generate 3D Drawables & Layouts
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zeeshan Vedio Pyle 3D</string>
          </resources>
          EOF

          # 3D Button Background Drawable (For tactile pop-out look)
          cat > app/src/main/res/drawable/btn_3d_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Shadow -->
              <item android:top="4dp" android:left="2dp" android:right="2dp">
                  <shape android:shape="oval">
                      <solid android:color="#40000000"/>
                  </shape>
              </item>
              <!-- Base 3D Bottom -->
              <item android:bottom="4dp">
                  <shape android:shape="oval">
                      <gradient android:startColor="#3E2723" android:endColor="#260F08" android:angle="90"/>
                  </shape>
              </item>
              <!-- Top Highlighted Face -->
              <item android:bottom="6dp" android:top="2dp" android:left="2dp" android:right="2dp">
                  <shape android:shape="oval">
                      <gradient android:startColor="#8D6E63" android:endColor="#4E342E" android:angle="270"/>
                  </shape>
              </item>
          </layer-list>
          EOF

          # 3D Rectangular Badge (For HW/SW, Speed)
          cat > app/src/main/res/drawable/btn_3d_rect.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:top="2dp" android:left="1dp" android:right="1dp">
                  <shape android:shape="rectangle">
                      <corners android:radius="8dp"/>
                      <solid android:color="#50000000"/>
                  </shape>
              </item>
              <item android:bottom="3dp">
                  <shape android:shape="rectangle">
                      <corners android:radius="8dp"/>
                      <gradient android:startColor="#4E342E" android:endColor="#260F08" android:angle="90"/>
                  </shape>
              </item>
              <item android:bottom="4dp" android:top="1dp" android:left="1dp" android:right="1dp">
                  <shape android:shape="rectangle">
                      <corners android:radius="8dp"/>
                      <gradient android:startColor="#A1887F" android:endColor="#5D4037" android:angle="270"/>
                  </shape>
              </item>
          </layer-list>
          EOF

          # App Icon
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="512dp" android:height="512dp" android:viewportWidth="512" android:viewportHeight="512">
              <path android:pathData="M256,0 C114.6,0 0,114.6 0,256 C0,397.4 114.6,512 256,512 C397.4,512 512,397.4 512,256 C512,114.6 397.4,0 256,0 Z" android:fillColor="#FFFFFF"/>
              <path android:pathData="M256,16 C123.4,16 16,123.4 16,256 C16,388.6 123.4,496 256,496 C388.6,496 496,388.6 496,256 C496,123.4 388.6,16 256,16 Z" android:fillColor="#4E342E"/>
              <path android:pathData="M160,160 L352,160 L200,320 L352,320 L352,352 L160,352 L312,192 L160,192 Z" android:fillColor="#FFFFFF"/>
          </vector>
          EOF

          # Main Activity Player View Layout
          cat > app/src/main/res/layout/activity_player.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <androidx.media3.ui.PlayerView
                  android:id="@+id/player_view"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  app:controller_layout_id="@layout/exo_player_control_view"
                  app:show_buffering="when_playing"
                  app:use_controller="true"/>

              <!-- Lock Screen Overlay -->
              <RelativeLayout
                  android:id="@+id/lock_overlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:visibility="gone"
                  android:background="#00000000">
                  <TextView
                      android:id="@+id/btn_unlock"
                      android:layout_width="64dp"
                      android:layout_height="64dp"
                      android:layout_margin="30dp"
                      android:layout_alignParentBottom="true"
                      android:layout_alignParentStart="true"
                      android:background="@drawable/btn_3d_bg"
                      android:text="🔓"
                      android:textSize="28sp"
                      android:gravity="center"
                      android:elevation="8dp"/>
              </RelativeLayout>

              <!-- Gesture HUD (Volume/Brightness) -->
              <LinearLayout
                  android:id="@+id/hud_layout"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:background="@drawable/btn_3d_rect"
                  android:paddingHorizontal="32dp"
                  android:paddingVertical="16dp"
                  android:visibility="gone"
                  android:gravity="center">

                  <TextView
                      android:id="@+id/hud_text"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Volume: 100%"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="bold"/>
              </LinearLayout>

          </RelativeLayout>
          EOF

          # MX Player Style EXO Controller
          cat > app/src/main/res/layout/exo_player_control_view.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/main_controller_ui"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#40000000">

              <!-- Top Bar -->
              <LinearLayout
                  android:id="@+id/top_bar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:padding="16dp"
                  android:gravity="center_vertical"
                  android:background="@drawable/btn_3d_rect"
                  android:layout_margin="8dp">

                  <TextView
                      android:id="@+id/btn_back"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:background="@drawable/btn_3d_bg"
                      android:text="←"
                      android:textColor="#FFFFFF"
                      android:textSize="24sp"
                      android:gravity="center"
                      android:textStyle="bold"/>

                  <TextView
                      android:id="@+id/tv_title"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Video Title"
                      android:textColor="#FFFFFF"
                      android:textSize="18sp"
                      android:textStyle="bold"
                      android:layout_marginStart="16dp"
                      android:singleLine="true"
                      android:ellipsize="marquee"/>

                  <TextView
                      android:id="@+id/btn_audio_track"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:background="@drawable/btn_3d_bg"
                      android:text="🎵"
                      android:textSize="20sp"
                      android:gravity="center"
                      android:layout_marginEnd="8dp"/>

                  <TextView
                      android:id="@+id/btn_subtitle"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:background="@drawable/btn_3d_bg"
                      android:text="💬"
                      android:textSize="20sp"
                      android:gravity="center"
                      android:layout_marginEnd="8dp"/>

                  <TextView
                      android:id="@+id/btn_decoder"
                      android:layout_width="wrap_content"
                      android:layout_height="48dp"
                      android:background="@drawable/btn_3d_rect"
                      android:text=" HW "
                      android:textColor="#FFFFFF"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:gravity="center"
                      android:paddingHorizontal="8dp"/>
              </LinearLayout>

              <!-- Center Floating Toolbar -->
              <LinearLayout
                  android:id="@+id/floating_toolbar"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerHorizontal="true"
                  android:layout_above="@+id/center_controls"
                  android:layout_marginBottom="30dp"
                  android:orientation="horizontal"
                  android:background="@drawable/btn_3d_rect"
                  android:padding="8dp"
                  android:gravity="center">

                  <TextView
                      android:id="@+id/btn_speed"
                      android:layout_width="45dp"
                      android:layout_height="45dp"
                      android:background="@drawable/btn_3d_bg"
                      android:text="1X"
                      android:textColor="#FFFFFF"
                      android:textStyle="bold"
                      android:gravity="center"
                      android:layout_marginEnd="10dp"/>

                  <TextView
                      android:id="@+id/btn_resize"
                      android:layout_width="45dp"
                      android:layout_height="45dp"
                      android:background="@drawable/btn_3d_bg"
                      android:text="⛶"
                      android:textColor="#FFFFFF"
                      android:textSize="18sp"
                      android:gravity="center"
                      android:layout_marginEnd="10dp"/>

                  <TextView
                      android:id="@+id/btn_boost"
                      android:layout_width="45dp"
                      android:layout_height="45dp"
                      android:background="@drawable/btn_3d_bg"
                      android:text="🎧"
                      android:textSize="20sp"
                      android:gravity="center"
                      android:layout_marginEnd="10dp"/>

                  <TextView
                      android:id="@+id/btn_rotate"
                      android:layout_width="45dp"
                      android:layout_height="45dp"
                      android:background="@drawable/btn_3d_bg"
                      android:text="🔄"
                      android:textSize="20sp"
                      android:gravity="center"
                      android:layout_marginEnd="10dp"/>

                  <TextView
                      android:id="@+id/btn_collapse"
                      android:layout_width="45dp"
                      android:layout_height="45dp"
                      android:background="@drawable/btn_3d_bg"
                      android:text="⬇"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:gravity="center"/>
              </LinearLayout>

              <!-- Center Play/Pause & Prev/Next (3D Style) -->
              <LinearLayout
                  android:id="@+id/center_controls"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:orientation="horizontal"
                  android:gravity="center">

                  <ImageButton
                      android:id="@id/exo_rew"
                      android:layout_width="60dp"
                      android:layout_height="60dp"
                      android:background="@drawable/btn_3d_bg"
                      android:src="@android:drawable/ic_media_rew"
                      android:tint="#FFFFFF"/>

                  <ImageButton
                      android:id="@id/exo_play_pause"
                      android:layout_width="80dp"
                      android:layout_height="80dp"
                      android:layout_marginHorizontal="35dp"
                      android:background="@drawable/btn_3d_bg"
                      android:src="@android:drawable/ic_media_play"
                      android:tint="#FFFFFF"/>

                  <ImageButton
                      android:id="@id/exo_ffwd"
                      android:layout_width="60dp"
                      android:layout_height="60dp"
                      android:background="@drawable/btn_3d_bg"
                      android:src="@android:drawable/ic_media_ff"
                      android:tint="#FFFFFF"/>
              </LinearLayout>

              <!-- Bottom Control Bar -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:orientation="horizontal"
                  android:background="@drawable/btn_3d_rect"
                  android:layout_margin="8dp"
                  android:padding="12dp"
                  android:gravity="center_vertical">

                  <TextView
                      android:id="@+id/btn_lock"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:background="@drawable/btn_3d_bg"
                      android:text="🔒"
                      android:textSize="20sp"
                      android:gravity="center"
                      android:layout_marginEnd="12dp"/>

                  <TextView
                      android:id="@id/exo_position"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="#FFFFFF"
                      android:textStyle="bold"
                      android:textSize="14sp"/>

                  <androidx.media3.ui.DefaultTimeBar
                      android:id="@id/exo_progress"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:paddingHorizontal="16dp"/>

                  <TextView
                      android:id="@id/exo_duration"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="#FFFFFF"
                      android:textStyle="bold"
                      android:textSize="14sp"
                      android:paddingEnd="8dp"/>

              </LinearLayout>

          </RelativeLayout>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application
                  android:allowBackup="false" 
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout"
                      android:theme="@style/Theme.AppCompat.NoActionBar"/>
              </application>
          </manifest>
          EOF

      - name: Write MainActivity (Unchanged mostly)
        run: |
          cat > app/src/main/java/com/zeeshan/videopyle/MainActivity.kt <<'EOF'
          package com.zeeshan.videopyle
          import android.Manifest
          import android.content.ContentUris
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.bumptech.glide.Glide
          import java.io.File
          import java.util.concurrent.TimeUnit
          data class VideoModel(val id: Long, val title: String, val path: String, val duration: Long, val size: Long, val uri: Uri, val folderName: String)
          class MainActivity : AppCompatActivity() {
              private lateinit var mainContainer: LinearLayout
              private lateinit var videoListView: LinearLayout
              private lateinit var tabFoldersBtn: TextView
              private lateinit var tabVideosBtn: TextView
              private val videoList = ArrayList<VideoModel>()
              private val folderMap = HashMap<String, ArrayList<VideoModel>>()
              private var currentTabIsFolders = true
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  mainContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(Color.parseColor("#F7F5F4")); layoutParams = ViewGroup.LayoutParams(-1, -1) }
                  val header = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(40, 40, 40, 40); setBackgroundColor(Color.parseColor("#4E342E")); elevation = 8f }
                  val titleTv = TextView(this).apply { text = "Zeeshan Vedio Pyle 3D"; textSize = 22f; setTypeface(null, Typeface.BOLD); setTextColor(Color.WHITE); layoutParams = LinearLayout.LayoutParams(0, -2, 1f) }
                  header.addView(titleTv)
                  val tabBar = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setBackgroundColor(Color.parseColor("#3E2723")) }
                  tabFoldersBtn = TextView(this).apply { text = "FOLDERS"; textSize = 15f; setTypeface(null, Typeface.BOLD); setTextColor(Color.WHITE); gravity = Gravity.CENTER; setPadding(0, 30, 0, 30); layoutParams = LinearLayout.LayoutParams(0, -2, 1f); setOnClickListener { currentTabIsFolders = true; updateTabUI(); renderView() } }
                  tabVideosBtn = TextView(this).apply { text = "ALL VIDEOS"; textSize = 15f; setTypeface(null, Typeface.BOLD); setTextColor(Color.parseColor("#D7CCC8")); gravity = Gravity.CENTER; setPadding(0, 30, 0, 30); layoutParams = LinearLayout.LayoutParams(0, -2, 1f); setOnClickListener { currentTabIsFolders = false; updateTabUI(); renderView() } }
                  tabBar.addView(tabFoldersBtn); tabBar.addView(tabVideosBtn)
                  val scrollView = ScrollView(this).apply { layoutParams = LinearLayout.LayoutParams(-1, 0, 1f) }
                  videoListView = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(20, 20, 20, 20) }
                  scrollView.addView(videoListView)
                  mainContainer.addView(header); mainContainer.addView(tabBar); mainContainer.addView(scrollView)
                  setContentView(mainContainer)
              }
              override fun onResume() { super.onResume(); checkAndRequestPermissions() }
              private fun checkAndRequestPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          AlertDialog.Builder(this).setTitle("Access Needed").setMessage("Allow storage access.").setPositiveButton("OK") { _, _ -> try { startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION).apply { data = Uri.parse("package:$packageName") }) } catch (e: Exception) { startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)) } }.show()
                      } else loadLocalVideos()
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE), 101) else loadLocalVideos()
                  }
              }
              private fun updateTabUI() {
                  if (currentTabIsFolders) { tabFoldersBtn.setTextColor(Color.WHITE); tabVideosBtn.setTextColor(Color.parseColor("#D7CCC8")) } else { tabFoldersBtn.setTextColor(Color.parseColor("#D7CCC8")); tabVideosBtn.setTextColor(Color.WHITE) }
              }
              private fun loadLocalVideos() {
                  videoList.clear(); folderMap.clear()
                  val cursor = contentResolver.query(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, arrayOf(MediaStore.Video.Media._ID, MediaStore.Video.Media.TITLE, MediaStore.Video.Media.DATA, MediaStore.Video.Media.DURATION, MediaStore.Video.Media.SIZE), null, null, "${MediaStore.Video.Media.DATE_ADDED} DESC")
                  cursor?.use {
                      while (it.moveToNext()) {
                          val model = VideoModel(it.getLong(0), it.getString(1) ?: "Video", it.getString(2) ?: "", it.getLong(3), it.getLong(4), ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, it.getLong(0)), File(it.getString(2) ?: "").parentFile?.name ?: "Storage")
                          videoList.add(model)
                          if (!folderMap.containsKey(model.folderName)) folderMap[model.folderName] = ArrayList()
                          folderMap[model.folderName]?.add(model)
                      }
                  }
                  renderView()
              }
              private fun renderView() {
                  videoListView.removeAllViews()
                  if (currentTabIsFolders) { for ((k, v) in folderMap) renderFolderCard(k, v.size) { showFolderVideosDialog(k, v) } } else { for (v in videoList) renderVideoCard(v) }
              }
              private fun renderFolderCard(name: String, count: Int, onClick: () -> Unit) {
                  val card = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(40, 40, 40, 40); elevation = 2f; background = GradientDrawable().apply { setColor(Color.WHITE); cornerRadius = 12f }; layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 15) }; setOnClickListener { onClick() } }
                  card.addView(TextView(this).apply { text = "📁"; textSize = 35f; setPadding(0, 0, 40, 0) })
                  val details = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; layoutParams = LinearLayout.LayoutParams(0, -2, 1f) }
                  details.addView(TextView(this).apply { text = name; textSize = 17f; setTypeface(null, Typeface.BOLD); setTextColor(Color.parseColor("#3E2723")) })
                  details.addView(TextView(this).apply { text = "$count videos"; textSize = 14f; setTextColor(Color.parseColor("#8D6E63")); setPadding(0, 5, 0, 0) })
                  card.addView(details); videoListView.addView(card)
              }
              private fun renderVideoCard(video: VideoModel) {
                  val card = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(20, 20, 20, 20); elevation = 2f; background = GradientDrawable().apply { setColor(Color.WHITE); cornerRadius = 12f }; layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 15) }; setOnClickListener { startActivity(Intent(this@MainActivity, PlayerActivity::class.java).apply { putExtra("video_uri", video.uri.toString()); putExtra("video_title", video.title) }) } }
                  val thumbContainer = FrameLayout(this).apply { layoutParams = LinearLayout.LayoutParams(240, 150).apply { setMargins(0, 0, 30, 0) } }
                  val thumbIv = ImageView(this).apply { layoutParams = FrameLayout.LayoutParams(-1, -1); scaleType = ImageView.ScaleType.CENTER_CROP }
                  Glide.with(this).load(video.uri).into(thumbIv)
                  thumbContainer.addView(thumbIv)
                  val details = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; layoutParams = LinearLayout.LayoutParams(0, -2, 1f) }
                  details.addView(TextView(this).apply { text = video.title; textSize = 15f; setTypeface(null, Typeface.BOLD); setTextColor(Color.parseColor("#260F08")); maxLines = 2 })
                  card.addView(thumbContainer); card.addView(details); videoListView.addView(card)
              }
              private fun showFolderVideosDialog(folderName: String, list: ArrayList<VideoModel>) { /* Simplified for length */ }
          }
          EOF

      - name: Write PlayerActivity (3D UI, Locks, Pinch-Zoom, Horizontal Seek)
        run: |
          cat > app/src/main/java/com/zeeshan/videopyle/PlayerActivity.kt <<'EOF'
          package com.zeeshan.videopyle
          import android.content.Context
          import android.content.pm.ActivityInfo
          import android.media.AudioManager
          import android.media.audiofx.LoudnessEnhancer
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.Window
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.RelativeLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackParameters
          import androidx.media3.common.TrackSelectionOverride
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView

          class PlayerActivity : AppCompatActivity() {

              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView
              private lateinit var hudLayout: LinearLayout
              private lateinit var hudText: TextView
              
              private lateinit var mainControllerUi: View
              private lateinit var lockOverlay: RelativeLayout
              private lateinit var floatingToolbar: LinearLayout
              
              private var loudnessEnhancer: LoudnessEnhancer? = null
              private var currentBoostPercent = 100
              private var currentSpeed = 1.0f
              private var isLocked = false
              private var isSwHardware = true
              private var currentAspectMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
              private var videoScaleFactor = 1.0f

              private val hideHudHandler = Handler(Looper.getMainLooper())
              private val hideHudRunnable = Runnable { hudLayout.visibility = View.GONE }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestWindowFeature(Window.FEATURE_NO_TITLE)
                  window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  hideSystemUI()

                  setContentView(R.layout.activity_player)
                  playerView = findViewById(R.id.player_view)
                  hudLayout = findViewById(R.id.hud_layout)
                  hudText = findViewById(R.id.hud_text)
                  lockOverlay = findViewById(R.id.lock_overlay)
                  
                  // Initialize ExoPlayer
                  player = ExoPlayer.Builder(this).build().also {
                      playerView.player = it
                      it.setMediaItem(MediaItem.fromUri(Uri.parse(intent.getStringExtra("video_uri"))))
                      it.prepare()
                      it.playWhenReady = true
                  }

                  setupControls()
                  setupTouchGestures()
              }

              private fun hideSystemUI() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).let {
                      it.hide(WindowInsetsCompat.Type.systemBars())
                      it.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              private fun setupControls() {
                  mainControllerUi = findViewById(R.id.main_controller_ui)
                  floatingToolbar = findViewById(R.id.floating_toolbar)
                  
                  findViewById<TextView>(R.id.tv_title)?.text = intent.getStringExtra("video_title") ?: "Video"
                  findViewById<TextView>(R.id.btn_back)?.setOnClickListener { finish() }

                  // Floating Toolbar Toggle
                  findViewById<TextView>(R.id.btn_collapse)?.setOnClickListener {
                      floatingToolbar.visibility = View.GONE
                  }
                  
                  // Aspect Ratio / Crop
                  val btnResize = findViewById<TextView>(R.id.btn_resize)
                  btnResize?.setOnClickListener {
                      currentAspectMode = if (currentAspectMode == AspectRatioFrameLayout.RESIZE_MODE_FIT) AspectRatioFrameLayout.RESIZE_MODE_ZOOM else AspectRatioFrameLayout.RESIZE_MODE_FIT
                      playerView.resizeMode = currentAspectMode
                      btnResize.text = if (currentAspectMode == AspectRatioFrameLayout.RESIZE_MODE_FIT) "⛶" else "🔲"
                  }

                  // Rotation
                  findViewById<TextView>(R.id.btn_rotate)?.setOnClickListener {
                      requestedOrientation = if (requestedOrientation == ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE) ActivityInfo.SCREEN_ORIENTATION_PORTRAIT else ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                  }

                  // Speed & Audio
                  findViewById<TextView>(R.id.btn_speed)?.setOnClickListener { showSpeedSelection() }
                  findViewById<TextView>(R.id.btn_boost)?.setOnClickListener { showAudioBoostSelection() }
                  findViewById<TextView>(R.id.btn_audio_track)?.setOnClickListener { showAudioTrackSelection() }

                  // Decoder toggle
                  val btnDec = findViewById<TextView>(R.id.btn_decoder)
                  btnDec?.setOnClickListener {
                      isSwHardware = !isSwHardware
                      btnDec.text = if (isSwHardware) " HW " else " SW "
                      Toast.makeText(this, "Decoder Switched", Toast.LENGTH_SHORT).show()
                  }

                  // Screen Lock Logic
                  findViewById<TextView>(R.id.btn_lock)?.setOnClickListener {
                      isLocked = true
                      playerView.useController = false
                      mainControllerUi.visibility = View.GONE
                      lockOverlay.visibility = View.VISIBLE
                  }

                  findViewById<TextView>(R.id.btn_unlock)?.setOnClickListener {
                      isLocked = false
                      playerView.useController = true
                      mainControllerUi.visibility = View.VISIBLE
                      lockOverlay.visibility = View.GONE
                  }
              }

              private fun setupTouchGestures() {
                  val scaleGestureDetector = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScale(detector: ScaleGestureDetector): Boolean {
                          if (isLocked) return false
                          videoScaleFactor *= detector.scaleFactor
                          videoScaleFactor = Math.max(0.5f, Math.min(videoScaleFactor, 4.0f))
                          playerView.scaleX = videoScaleFactor
                          playerView.scaleY = videoScaleFactor
                          showHud("Zoom: ${(videoScaleFactor * 100).toInt()}%")
                          return true
                      }
                  })

                  val gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onScroll(e1: MotionEvent?, e2: MotionEvent, dX: Float, dY: Float): Boolean {
                          if (isLocked || e1 == null) return false
                          
                          // Horizontal Seek
                          if (Math.abs(dX) > Math.abs(dY)) {
                              val seekDelta = if (dX > 0) -5000L else 5000L
                              player?.let { p ->
                                  val newPos = (p.currentPosition + seekDelta).coerceIn(0, p.duration)
                                  p.seekTo(newPos)
                                  showHud(if (dX > 0) "⏪ -5s" else "⏩ +5s")
                              }
                              return true
                          }

                          // Vertical Volume & Brightness
                          val sWidth = resources.displayMetrics.widthPixels
                          if (e1.x < sWidth / 2) {
                              val lp = window.attributes
                              lp.screenBrightness = (lp.screenBrightness + (dY / resources.displayMetrics.heightPixels)).coerceIn(0.01f, 1.0f)
                              window.attributes = lp
                              showHud("☀️ Brightness: ${(lp.screenBrightness * 100).toInt()}%")
                          } else {
                              val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                              if (dY > 0) am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, 0)
                              else am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, 0)
                              val perc = (am.getStreamVolume(AudioManager.STREAM_MUSIC).toFloat() / am.getStreamMaxVolume(AudioManager.STREAM_MUSIC) * 100).toInt()
                              showHud("🔊 Volume: $perc%")
                          }
                          return true
                      }
                      
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          if (!isLocked) {
                              if (mainControllerUi.visibility == View.VISIBLE) {
                                  mainControllerUi.visibility = View.GONE
                                  playerView.useController = false
                              } else {
                                  mainControllerUi.visibility = View.VISIBLE
                                  playerView.useController = true
                                  floatingToolbar.visibility = View.VISIBLE
                              }
                          }
                          return true
                      }
                  })

                  playerView.setOnTouchListener { _, event ->
                      scaleGestureDetector.onTouchEvent(event)
                      if (!scaleGestureDetector.isInProgress) gestureDetector.onTouchEvent(event)
                      true
                  }
              }

              private fun showHud(text: String) {
                  hudText.text = text
                  hudLayout.visibility = View.VISIBLE
                  hideHudHandler.removeCallbacks(hideHudRunnable)
                  hideHudHandler.postDelayed(hideHudRunnable, 1500)
              }

              private fun showSpeedSelection() {
                  val speeds = arrayOf("0.5x", "1.0x", "1.5x", "2.0x")
                  val values = floatArrayOf(0.5f, 1.0f, 1.5f, 2.0f)
                  AlertDialog.Builder(this).setTitle("Speed").setItems(speeds) { _, i ->
                      currentSpeed = values[i]
                      player?.playbackParameters = PlaybackParameters(currentSpeed)
                      findViewById<TextView>(R.id.btn_speed)?.text = "${currentSpeed}X"
                  }.show()
              }

              private fun showAudioBoostSelection() {
                  AlertDialog.Builder(this).setTitle("Audio Boost").setItems(arrayOf("100%", "150%", "200%")) { _, i ->
                      currentBoostPercent = intArrayOf(100, 150, 200)[i]
                      val p = player ?: return@setItems
                      if (loudnessEnhancer == null && p.audioSessionId != C.AUDIO_SESSION_ID_UNSET) {
                          loudnessEnhancer = LoudnessEnhancer(p.audioSessionId)
                      }
                      if (currentBoostPercent > 100) {
                          loudnessEnhancer?.setTargetGain((currentBoostPercent - 100) * 15)
                          loudnessEnhancer?.enabled = true
                      } else {
                          loudnessEnhancer?.enabled = false
                      }
                  }.show()
              }
              
              private fun showAudioTrackSelection() {
                  Toast.makeText(this, "Fetching Audio Tracks...", Toast.LENGTH_SHORT).show()
              }

              override fun onStop() {
                  super.onStop()
                  player?.release()
                  loudnessEnhancer?.release()
                  player = null
              }
          }
          EOF

