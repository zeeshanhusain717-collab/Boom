          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="8dp" />
              <solid android:color="#4DFFFFFF" />
              <stroke android:width="1dp" android:color="#80FFFFFF" />
          </shape>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="#F7F5F4">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:background="#4E342E" android:padding="16dp" android:elevation="8dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="Zeeshan Vedio Pyle" android:textColor="#FFFFFF" android:textSize="22sp" android:textStyle="bold"/>
              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:background="#3E2723" android:elevation="4dp" android:orientation="horizontal">
                  <TextView android:id="@+id/tab_folders" android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:text="FOLDERS" android:textColor="#FFFFFF" android:gravity="center"
                      android:paddingVertical="12dp" android:textStyle="bold" android:textSize="14sp"/>
                  <TextView android:id="@+id/tab_videos" android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:text="ALL VIDEOS" android:textColor="#D7CCC8" android:gravity="center"
                      android:paddingVertical="12dp" android:textStyle="bold" android:textSize="14sp"/>
              </LinearLayout>
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/recycler_view" android:layout_width="match_parent" android:layout_height="match_parent"
                  android:padding="8dp" android:clipToPadding="false"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/activity_player.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000000">

              <androidx.media3.ui.PlayerView
                  android:id="@+id/player_view" android:layout_width="match_parent" android:layout_height="match_parent"
                  app:controller_layout_id="@layout/exo_player_control_view" app:show_buffering="when_playing" app:use_controller="true"/>

