          class MainActivity : AppCompatActivity() {

              companion object {
                  private const val THUMB_CACHE_BYTES = 4 * 1024 * 1024
                  private const val MAX_TILT_DEG = 20f
              }

              private lateinit var viewFinder: PreviewView
              private lateinit var statusText: TextView
              private lateinit var galleryList: RecyclerView
              private lateinit var btnShutter: Button
              private lateinit var btnFinish: Button
              private lateinit var busyIndicator: ProgressBar

              private lateinit var poseTracker: PoseTracker
              private lateinit var worker: ExecutorService
              private lateinit var galleryAdapter: GalleryAdapter
              private var imageCapture: ImageCapture? = null

              private val thumbCache = object : LruCache<String, Bitmap>(THUMB_CACHE_BYTES) {
                  override fun sizeOf(key: String, value: Bitmap): Int = value.byteCount
              }

              private val frames = mutableListOf<CubemapProcessor.Frame>()
              private var sessionDir: File? = null
              private var generation = 0
              private var sweeping = false
              private var captureInFlight = false
              private var processing = false
              private var guided = false
              private var currentYaw = 0f
              private var currentTilt = 0f

              private val cameraPermission =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                      if (granted) startCamera() else statusText.text = getString(R.string.camera_denied)
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  viewFinder = findViewById(R.id.viewFinder)
                  statusText = findViewById(R.id.statusText)
                  galleryList = findViewById(R.id.galleryList)
                  btnShutter = findViewById(R.id.btnShutter)
                  btnFinish = findViewById(R.id.btnFinish)
                  busyIndicator = findViewById(R.id.busyIndicator)

                  worker = CubemapProcessor.newSingleWorker("panco-main")

                  poseTracker = PoseTracker(this, object : PoseTracker.Listener {
                      override fun onYaw(yawDeg: Float) {
                          currentYaw = yawDeg
                          onYawChanged()
                      }
                      override fun onTilt(tiltDeg: Float) {
                          currentTilt = tiltDeg
                          updateStatus()
                      }
                  })
                  guided = poseTracker.hasHeading

                  galleryAdapter = GalleryAdapter(mutableListOf(), ::loadThumb) { openViewer(it) }
                  galleryList.layoutManager = LinearLayoutManager(this, RecyclerView.HORIZONTAL, false)
                  galleryList.adapter = galleryAdapter

                  btnShutter.setOnClickListener { onShutterPressed() }
                  btnFinish.setOnClickListener { finishSweep() }

                  updateButtons()
                  updateStatus()

                  if (hasCameraPermission()) startCamera()
                  else cameraPermission.launch(Manifest.permission.CAMERA)
              }

              override fun onResume() {
                  super.onResume()
                  poseTracker.start()
                  loadGallery()
              }

              override fun onPause() {
                  poseTracker.stop()
                  if (sweeping) cancelSweep()
                  super.onPause()
              }

              override fun onDestroy() {
                  worker.shutdownNow()
                  super.onDestroy()
              }

              private fun hasCameraPermission(): Boolean =
                  ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) ==
                      PackageManager.PERMISSION_GRANTED

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      try {
                          val provider = future.get()
                          val preview = Preview.Builder().build().also {
                              it.setSurfaceProvider(viewFinder.surfaceProvider)
                          }
                          val capture = ImageCapture.Builder()
                              .setCaptureMode(ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY)
                              .setJpegQuality(85)
                              .setResolutionSelector(
                                  ResolutionSelector.Builder()
                                      .setResolutionStrategy(
                                          ResolutionStrategy(
                                              Size(CubemapProcessor.FRAME_W, CubemapProcessor.FRAME_H),
                                              ResolutionStrategy.FALLBACK_RULE_CLOSEST_HIGHER_THEN_LOWER
                                          )
                                      )
                                      .build()
                              )
                              .build()
                          imageCapture = capture

                          provider.unbindAll()
                          provider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview, capture)
                      } catch (e: Exception) {
                          statusText.text = getString(R.string.error_camera)
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun captureFrame(yawDeg: Float) {
                  val capture = imageCapture ?: return
                  captureInFlight = true
                  val dir = sessionDir ?: File(cacheDir, "sweep_${System.currentTimeMillis()}").also {
                      it.mkdirs()
                      sessionDir = it
                  }
                  val file = File(dir, "frame_%03d.jpg".format(frames.size))
                  val gen = generation

                  capture.takePicture(
                      ImageCapture.OutputFileOptions.Builder(file).build(),
                      ContextCompat.getMainExecutor(this),
                      object : ImageCapture.OnImageSavedCallback {
                          override fun onImageSaved(output: ImageCapture.OutputFileResults) {
                              captureInFlight = false
                              if (gen != generation) {
                                  file.delete()
                                  return
                              }
                              frames += CubemapProcessor.Frame(file, yawDeg)
                              updateButtons()
                              updateStatus()
                              if (sweeping && frames.size >= CubemapProcessor.FULL_SWEEP_FRAMES) {
                                  finishSweep()
                              }
                          }
                          override fun onError(exc: ImageCaptureException) {
                              captureInFlight = false
                              Toast.makeText(this@MainActivity, R.string.error_capture, Toast.LENGTH_SHORT).show()
                          }
                      }
                  )
              }

              private fun onShutterPressed() {
                  if (processing || captureInFlight) return
                  when {
                      !guided -> captureFrame(frames.size * CubemapProcessor.STEP_DEG)
                      sweeping -> cancelSweep()
                      else -> beginSweep()
                  }
              }

              private fun onYawChanged() {
                  updateStatus()
                  if (!sweeping || processing || captureInFlight) return
                  if (abs(currentTilt) > MAX_TILT_DEG) return
                  val target = frames.size * CubemapProcessor.STEP_DEG
                  if (currentYaw >= target) captureFrame(currentYaw)
              }

              private fun beginSweep() {
                  poseTracker.resetHeading()
                  frames.clear()
                  sessionDir = null
                  sweeping = true
                  updateButtons()
                  updateStatus()
              }

              private fun cancelSweep() {
                  generation++
                  sweeping = false
                  frames.clear()
                  sessionDir?.deleteRecursively()
                  sessionDir = null
                  updateButtons()
                  updateStatus()
              }

              private fun finishSweep() {
                  if (processing) return
                  if (frames.size < CubemapProcessor.MIN_FRAMES) {
                      Toast.makeText(this, R.string.error_not_enough_frames, Toast.LENGTH_SHORT).show()
                      return
                  }
                  val snapshot = frames.toList()
                  val session = sessionDir
                  val sensorMode = if (guided) "rotation_vector" else "manual_assumed_yaw"
                  val hasGyro = poseTracker.hasGyroscope
                  val out = File(PancoContainer.dir(this), "panco_${System.currentTimeMillis()}.${PancoContainer.EXT}")

                  generation++
                  sweeping = false
                  frames.clear()
                  sessionDir = null
                  processing = true
                  updateButtons()

                  worker.execute {
                      try {
                          CubemapProcessor.build(snapshot, out, sensorMode, hasGyro) { pct ->
                              runOnUiThread { statusText.text = getString(R.string.building, pct) }
                          }
                          runOnUiThread {
                              processing = false
                              updateButtons()
                              updateStatus()
                              loadGallery()
                              Toast.makeText(this, R.string.saved, Toast.LENGTH_SHORT).show()
                          }
                      } catch (e: Exception) {
                          out.delete()
                          runOnUiThread {
                              processing = false
                              updateButtons()
                              statusText.text = getString(R.string.error_build)
                          }
                      } finally {
                          session?.deleteRecursively()
                      }
                  }
              }

              private fun updateButtons() {
                  btnShutter.text = when {
                      !guided -> getString(R.string.shoot)
                      sweeping -> getString(R.string.cancel)
                      else -> getString(R.string.start_sweep)
                  }
                  btnShutter.isEnabled = !processing
                  btnFinish.isEnabled = !processing && frames.size >= CubemapProcessor.MIN_FRAMES
                  busyIndicator.visibility = if (processing) View.VISIBLE else View.GONE
              }

              private fun updateStatus() {
                  if (processing) return
                  val text = StringBuilder()
                  if (abs(currentTilt) > MAX_TILT_DEG) text.append(getString(R.string.tilt_warning)).append('\n')
                  if (!guided) text.append(getString(R.string.manual_mode)).append('\n')
                  text.append(
                      if (guided) getString(R.string.progress_frames, frames.size, currentYaw.toInt())
                      else getString(R.string.progress_manual, frames.size)
                  )
                  statusText.text = text.toString()
              }

              private fun loadGallery() {
                  galleryAdapter.setItems(PancoContainer.listNewestFirst(this))
              }

              private fun loadThumb(file: File, view: ImageView) {
                  view.tag = file
                  val cached = thumbCache.get(file.absolutePath)
                  if (cached != null) {
                      view.setImageBitmap(cached)
                      return
                  }
                  view.setImageResource(android.R.drawable.ic_menu_gallery)
                  worker.execute {
                      val bmp = runCatching { PancoContainer.readThumb(file, 2) }.getOrNull() ?: return@execute
                      thumbCache.put(file.absolutePath, bmp)
                      runOnUiThread {
                          if (view.tag == file) view.setImageBitmap(bmp)
                      }
                  }
              }

              private fun openViewer(file: File) {
                  startActivity(
                      Intent(this, ViewerActivity::class.java)
                          .putExtra(ViewerActivity.EXTRA_PATH, file.absolutePath)
                  )
              }
          }
