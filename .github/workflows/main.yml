name: Build Zeeshan Vedio Pyle Pro APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pure Offline Advanced Video Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/videopyle
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout

          # gradle.properties
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          # settings.gradle
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanVedioPyle"
          include(":app")
          EOF

          # Root build.gradle
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          # App build.gradle
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.videopyle"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.videopyle"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              buildTypes { 
                  release { 
                      minifyEnabled false 
                  } 
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.constraintlayout:constraintlayout:2.1.4"
              
              // Media3 ExoPlayer Engine
              implementation "androidx.media3:media3-exoplayer:1.3.1"
              implementation "androidx.media3:media3-ui:1.3.1"
              implementation "androidx.media3:media3-common:1.3.1"
              
              // Glide for Video Thumbnails
              implementation "com.github.bumptech.glide:glide:4.16.0"
          }
          EOF

      - name: Generate Resources, App Icon & Custom Layouts
        run: |
          set -euo pipefail

          # strings.xml
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zeeshan vedio pyle</string>
          </resources>
          EOF

          # White & Chocolate App Icon with 'Z' Logo
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="512dp"
              android:height="512dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path android:pathData="M256,0 C114.6,0 0,114.6 0,256 C0,397.4 114.6,512 256,512 C397.4,512 512,397.4 512,256 C512,114.6 397.4,0 256,0 Z" android:fillColor="#FFFFFF"/>
              <path android:pathData="M256,16 C123.4,16 16,123.4 16,256 C16,388.6 123.4,496 256,496 C388.6,496 496,388.6 496,256 C496,123.4 388.6,16 256,16 Z" android:fillColor="#4E342E"/>
              <path android:pathData="M160,160 L352,160 L200,320 L352,320 L352,352 L160,352 L312,192 L160,192 Z" android:fillColor="#FFFFFF"/>
          </vector>
          EOF

          # Activity Player Layout (Contains PlayerView and Gesture HUD Overlay)
          cat > app/src/main/res/layout/activity_player.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <androidx.media3.ui.PlayerView
                  android:id="@+id/player_view"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  app:controller_layout_id="@layout/exo_player_control_view"
                  app:show_buffering="when_playing"
                  app:use_controller="true"/>

              <!-- MX Style Gesture Progress HUD -->
              <LinearLayout
                  android:id="@+id/hud_layout"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:background="#B3260F08"
                  android:paddingHorizontal="24dp"
                  android:paddingVertical="12dp"
                  android:visibility="gone"
                  android:gravity="center">

                  <TextView
                      android:id="@+id/hud_text"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Volume: 100%"
                      android:textColor="#FFFFFF"
                      android:textSize="18sp"
                      android:textStyle="bold"/>
              </LinearLayout>

          </RelativeLayout>
          EOF

          # ExoPlayer Controller Layout (Single Unified Control View)
          cat > app/src/main/res/layout/exo_player_control_view.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#40000000">

              <!-- Top Bar -->
              <LinearLayout
                  android:id="@+id/top_bar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:padding="12dp"
                  android:gravity="center_vertical"
                  android:background="#99260F08">

                  <TextView
                      android:id="@+id/btn_back"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="←"
                      android:textColor="#FFFFFF"
                      android:textSize="26sp"
                      android:paddingEnd="16dp"/>

                  <TextView
                      android:id="@+id/tv_title"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Video Title"
                      android:textColor="#FFFFFF"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:maxLines="1"
                      android:ellipsize="end"/>

                  <TextView
                      android:id="@+id/btn_rotate"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="🔄"
                      android:textSize="20sp"
                      android:padding="8dp"/>

                  <TextView
                      android:id="@+id/btn_resize"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="🔲 FIT"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp"
                      android:textStyle="bold"
                      android:background="#33FFFFFF"
                      android:padding="8dp"/>

              </LinearLayout>

              <!-- Center Play/Pause & Seek Controls -->
              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:orientation="horizontal"
                  android:gravity="center">

                  <ImageButton
                      android:id="@id/exo_rew"
                      android:layout_width="52dp"
                      android:layout_height="52dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@android:drawable/ic_media_rew"
                      android:tint="#FFFFFF"/>

                  <ImageButton
                      android:id="@id/exo_play_pause"
                      android:layout_width="64dp"
                      android:layout_height="64dp"
                      android:layout_marginHorizontal="28dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@android:drawable/ic_media_play"
                      android:tint="#FFFFFF"/>

                  <ImageButton
                      android:id="@id/exo_ffwd"
                      android:layout_width="52dp"
                      android:layout_height="52dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@android:drawable/ic_media_ff"
                      android:tint="#FFFFFF"/>
              </LinearLayout>

              <!-- Bottom Bar with Timeline and Gear Settings Menu -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:orientation="horizontal"
                  android:background="#99260F08"
                  android:padding="10dp"
                  android:gravity="center_vertical">

                  <TextView
                      android:id="@id/exo_position"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp"/>

                  <androidx.media3.ui.DefaultTimeBar
                      android:id="@id/exo_progress"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:paddingHorizontal="8dp"/>

                  <TextView
                      android:id="@id/exo_duration"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp"
                      android:paddingEnd="12dp"/>

                  <!-- Gear Settings Button (Opens Speed, Boost & Language) -->
                  <TextView
                      android:id="@+id/btn_settings_gear"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="⚙️"
                      android:textSize="22sp"
                      android:padding="6dp"/>

              </LinearLayout>

          </RelativeLayout>
          EOF

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="false" 
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|orientation"
                      android:theme="@style/Theme.AppCompat.NoActionBar"/>
              </application>
          </manifest>
          EOF

      - name: Write Kotlin Source Code (MainActivity & PlayerActivity)
        run: |
          # Write Chocolate Themed MainActivity.kt
          cat > app/src/main/java/com/zeeshan/videopyle/MainActivity.kt <<'EOF'
          package com.zeeshan.videopyle

          import android.Manifest
          import android.content.ContentUris
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.bumptech.glide.Glide
          import java.io.File
          import java.util.concurrent.TimeUnit

          data class VideoModel(
              val id: Long,
              val title: String,
              val path: String,
              val duration: Long,
              val size: Long,
              val uri: Uri,
              val folderName: String
          )

          class MainActivity : AppCompatActivity() {

              private lateinit var mainContainer: LinearLayout
              private lateinit var videoListView: LinearLayout
              private lateinit var tabFoldersBtn: TextView
              private lateinit var tabVideosBtn: TextView
              
              private val videoList = ArrayList<VideoModel>()
              private val folderMap = HashMap<String, ArrayList<VideoModel>>()
              private var currentTabIsFolders = true

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  mainContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#F7F5F4"))
                      layoutParams = ViewGroup.LayoutParams(-1, -1)
                  }

                  // Rich Chocolate Header
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(40, 40, 40, 40)
                      setBackgroundColor(Color.parseColor("#4E342E"))
                      elevation = 8f
                  }

                  val titleTv = TextView(this).apply {
                      text = "Zeeshan vedio pyle"
                      textSize = 22f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }

                  header.addView(titleTv)

                  val tabBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#3E2723"))
                  }

                  tabFoldersBtn = TextView(this).apply {
                      text = "FOLDERS"
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 30, 0, 30)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                      setOnClickListener {
                          currentTabIsFolders = true
                          updateTabUI()
                          renderView()
                      }
                  }

                  tabVideosBtn = TextView(this).apply {
                      text = "ALL VIDEOS"
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#D7CCC8"))
                      gravity = Gravity.CENTER
                      setPadding(0, 30, 0, 30)
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                      setOnClickListener {
                          currentTabIsFolders = false
                          updateTabUI()
                          renderView()
                      }
                  }

                  tabBar.addView(tabFoldersBtn)
                  tabBar.addView(tabVideosBtn)

                  val scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)
                  }

                  videoListView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 20, 20, 20)
                  }

                  scrollView.addView(videoListView)

                  mainContainer.addView(header)
                  mainContainer.addView(tabBar)
                  mainContainer.addView(scrollView)

                  setContentView(mainContainer)
              }

              override fun onResume() {
                  super.onResume()
                  checkAndRequestPermissions()
              }

              private fun checkAndRequestPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          AlertDialog.Builder(this)
                              .setTitle("All Files Access Needed")
                              .setMessage("Full storage access is required to list and play offline video files.")
                              .setPositiveButton("Grant Permission") { _, _ ->
                                  try {
                                      val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION).apply {
                                          data = Uri.parse("package:$packageName")
                                      }
                                      startActivity(intent)
                                  } catch (e: Exception) {
                                      val intent = Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)
                                      startActivity(intent)
                                  }
                              }
                              .setNegativeButton("Cancel", null)
                              .show()
                      } else {
                          loadLocalVideos()
                      }
                  } else {
                      val permission = Manifest.permission.READ_EXTERNAL_STORAGE
                      if (ContextCompat.checkSelfPermission(this, permission) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(permission), 101)
                      } else {
                          loadLocalVideos()
                      }
                  }
              }

              private fun updateTabUI() {
                  if (currentTabIsFolders) {
                      tabFoldersBtn.setTextColor(Color.WHITE)
                      tabVideosBtn.setTextColor(Color.parseColor("#D7CCC8"))
                  } else {
                      tabFoldersBtn.setTextColor(Color.parseColor("#D7CCC8"))
                      tabVideosBtn.setTextColor(Color.WHITE)
                  }
              }

              private fun loadLocalVideos() {
                  videoList.clear()
                  folderMap.clear()

                  val projection = arrayOf(
                      MediaStore.Video.Media._ID,
                      MediaStore.Video.Media.TITLE,
                      MediaStore.Video.Media.DATA,
                      MediaStore.Video.Media.DURATION,
                      MediaStore.Video.Media.SIZE
                  )

                  val cursor = contentResolver.query(
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                      projection, null, null,
                      "${MediaStore.Video.Media.DATE_ADDED} DESC"
                  )

                  cursor?.use {
                      val idCol = it.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                      val titleCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.TITLE)
                      val pathCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.DATA)
                      val durCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                      val sizeCol = it.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)

                      while (it.moveToNext()) {
                          val id = it.getLong(idCol)
                          val title = it.getString(titleCol) ?: "Video"
                          val path = it.getString(pathCol) ?: ""
                          val duration = it.getLong(durCol)
                          val size = it.getLong(sizeCol)
                          val uri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)

                          val folder = File(path).parentFile?.name ?: "Internal Storage"
                          val model = VideoModel(id, title, path, duration, size, uri, folder)

                          videoList.add(model)

                          if (!folderMap.containsKey(folder)) {
                              folderMap[folder] = ArrayList()
                          }
                          folderMap[folder]?.add(model)
                      }
                  }

                  renderView()
              }

              private fun renderView() {
                  videoListView.removeAllViews()

                  if (currentTabIsFolders) {
                      for ((folderName, list) in folderMap) {
                          renderFolderCard(folderName, list.size) {
                              showFolderVideosDialog(folderName, list)
                          }
                      }
                  } else {
                      for (video in videoList) {
                          renderVideoCard(video)
                      }
                  }
              }

              private fun renderFolderCard(name: String, count: Int, onClick: () -> Unit) {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(40, 40, 40, 40)
                      elevation = 2f
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 12f
                      }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 15) }
                      setOnClickListener { onClick() }
                  }

                  val icon = TextView(this).apply {
                      text = "📁"
                      textSize = 35f
                      setPadding(0, 0, 40, 0)
                  }

                  val details = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }

                  val titleTv = TextView(this).apply {
                      text = name
                      textSize = 17f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#3E2723"))
                  }

                  val countTv = TextView(this).apply {
                      text = "$count videos"
                      textSize = 14f
                      setTextColor(Color.parseColor("#8D6E63"))
                      setPadding(0, 5, 0, 0)
                  }

                  details.addView(titleTv)
                  details.addView(countTv)

                  card.addView(icon)
                  card.addView(details)

                  videoListView.addView(card)
              }

              private fun renderVideoCard(video: VideoModel) {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(20, 20, 20, 20)
                      elevation = 2f
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 12f
                      }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 15) }
                      setOnClickListener {
                          val intent = Intent(this@MainActivity, PlayerActivity::class.java).apply {
                              putExtra("video_uri", video.uri.toString())
                              putExtra("video_title", video.title)
                          }
                          startActivity(intent)
                      }
                  }

                  val thumbContainer = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(240, 150).apply { setMargins(0, 0, 30, 0) }
                  }

                  val thumbIv = ImageView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                      scaleType = ImageView.ScaleType.CENTER_CROP
                  }
                  Glide.with(this).load(video.uri).into(thumbIv)

                  val durationTv = TextView(this).apply {
                      text = formatDuration(video.duration)
                      textSize = 10f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#B33E2723"))
                      setPadding(8, 4, 8, 4)
                      layoutParams = FrameLayout.LayoutParams(-2, -2).apply {
                          gravity = Gravity.BOTTOM or Gravity.END
                          setMargins(0, 0, 8, 8)
                      }
                  }

                  thumbContainer.addView(thumbIv)
                  thumbContainer.addView(durationTv)

                  val details = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  }

                  val titleTv = TextView(this).apply {
                      text = video.title
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#260F08"))
                      maxLines = 2
                  }

                  val sizeTv = TextView(this).apply {
                      text = formatSize(video.size)
                      textSize = 13f
                      setTextColor(Color.parseColor("#5D4037"))
                      setPadding(0, 10, 0, 0)
                  }

                  details.addView(titleTv)
                  details.addView(sizeTv)

                  card.addView(thumbContainer)
                  card.addView(details)

                  videoListView.addView(card)
              }

              private fun showFolderVideosDialog(folderName: String, list: ArrayList<VideoModel>) {
                  val dialog = android.app.Dialog(this, android.R.style.Theme_Light_NoTitleBar_Fullscreen)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#F7F5F4"))
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(40, 40, 40, 40)
                      setBackgroundColor(Color.parseColor("#4E342E"))
                  }

                  val backBtn = TextView(this).apply {
                      text = "←"
                      textSize = 26f
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 40, 0)
                      setOnClickListener { dialog.dismiss() }
                  }

                  val titleTv = TextView(this).apply {
                      text = folderName
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                  }

                  header.addView(backBtn)
                  header.addView(titleTv)

                  val scrollView = ScrollView(this)
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 20, 20, 20)
                  }

                  for (v in list) {
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(20, 20, 20, 20)
                          elevation = 2f
                          background = GradientDrawable().apply {
                              setColor(Color.WHITE)
                              cornerRadius = 12f
                          }
                          layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 15) }
                          setOnClickListener {
                              dialog.dismiss()
                              val intent = Intent(this@MainActivity, PlayerActivity::class.java).apply {
                                  putExtra("video_uri", v.uri.toString())
                                  putExtra("video_title", v.title)
                              }
                              startActivity(intent)
                          }
                      }

                      val thumbContainer = FrameLayout(this).apply {
                          layoutParams = LinearLayout.LayoutParams(240, 150).apply { setMargins(0, 0, 30, 0) }
                      }

                      val thumbIv = ImageView(this).apply {
                          layoutParams = FrameLayout.LayoutParams(-1, -1)
                          scaleType = ImageView.ScaleType.CENTER_CROP
                      }
                      Glide.with(this).load(v.uri).into(thumbIv)

                      val durationTv = TextView(this).apply {
                          text = formatDuration(v.duration)
                          textSize = 10f
                          setTextColor(Color.WHITE)
                          setBackgroundColor(Color.parseColor("#B33E2723"))
                          setPadding(8, 4, 8, 4)
                          layoutParams = FrameLayout.LayoutParams(-2, -2).apply {
                              gravity = Gravity.BOTTOM or Gravity.END
                              setMargins(0, 0, 8, 8)
                          }
                      }

                      thumbContainer.addView(thumbIv)
                      thumbContainer.addView(durationTv)

                      val details = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                      }

                      val tTv = TextView(this).apply {
                          text = v.title
                          textSize = 15f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.parseColor("#260F08"))
                          maxLines = 2
                      }

                      val sTv = TextView(this).apply {
                          text = formatSize(v.size)
                          textSize = 13f
                          setTextColor(Color.parseColor("#5D4037"))
                          setPadding(0, 10, 0, 0)
                      }

                      details.addView(tTv)
                      details.addView(sTv)

                      card.addView(thumbContainer)
                      card.addView(details)
                      container.addView(card)
                  }

                  scrollView.addView(container)
                  layout.addView(header)
                  layout.addView(scrollView)

                  dialog.setContentView(layout)
                  dialog.show()
              }

              private fun formatDuration(millis: Long): String {
                  val hrs = TimeUnit.MILLISECONDS.toHours(millis)
                  val mins = TimeUnit.MILLISECONDS.toMinutes(millis) % 60
                  val secs = TimeUnit.MILLISECONDS.toSeconds(millis) % 60
                  return if (hrs > 0) String.format("%02d:%02d:%02d", hrs, mins, secs)
                  else String.format("%02d:%02d", mins, secs)
              }

              private fun formatSize(bytes: Long): String {
                  val mb = bytes.toDouble() / (1024 * 1024)
                  return String.format("%.1f MB", mb)
              }
          }
          EOF

          # Write PlayerActivity.kt (Single ExoPlayer Layout, Gesture HUD, Audio Track Selector, 200% Boost in Gear Menu)
          cat > app/src/main/java/com/zeeshan/videopyle/PlayerActivity.kt <<'EOF'
          package com.zeeshan.videopyle

          import android.content.Context
          import android.content.pm.ActivityInfo
          import android.media.AudioManager
          import android.media.audiofx.LoudnessEnhancer
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import android.view.Window
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackParameters
          import androidx.media3.common.TrackSelectionOverride
          import androidx.media3.common.Tracks
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView

          class PlayerActivity : AppCompatActivity() {

              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView
              private lateinit var hudLayout: LinearLayout
              private lateinit var hudText: TextView
              
              private var loudnessEnhancer: LoudnessEnhancer? = null
              private var currentBoostPercent = 100 // 100% is normal volume, up to 200%
              private var currentSpeed = 1.0f

              private var videoUriStr: String? = null
              private var videoTitle: String? = null

              private var currentAspectMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
              private val hideHudHandler = Handler(Looper.getMainLooper())
              private val hideHudRunnable = Runnable { hudLayout.visibility = View.GONE }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  requestWindowFeature(Window.FEATURE_NO_TITLE)
                  window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  hideSystemUI()

                  setContentView(R.layout.activity_player)

                  videoUriStr = intent.getStringExtra("video_uri")
                  videoTitle = intent.getStringExtra("video_title")

                  playerView = findViewById(R.id.player_view)
                  hudLayout = findViewById(R.id.hud_layout)
                  hudText = findViewById(R.id.hud_text)

                  setupCustomControls()
                  setupTouchGestures()
                  initEngine()
              }

              private fun hideSystemUI() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).let { controller ->
                      controller.hide(WindowInsetsCompat.Type.systemBars())
                      controller.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              private fun setupCustomControls() {
                  findViewById<TextView>(R.id.tv_title)?.text = videoTitle ?: "Video Player"

                  findViewById<TextView>(R.id.btn_back)?.setOnClickListener { finish() }

                  // Rotate Screen Button (Landscape / Portrait)
                  findViewById<TextView>(R.id.btn_rotate)?.setOnClickListener {
                      requestedOrientation = if (requestedOrientation == ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE) {
                          ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                      } else {
                          ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                      }
                  }

                  // Aspect Ratio / Resize Toggle
                  val btnResize = findViewById<TextView>(R.id.btn_resize)
                  btnResize?.setOnClickListener {
                      when (currentAspectMode) {
                          AspectRatioFrameLayout.RESIZE_MODE_FIT -> {
                              currentAspectMode = AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                              playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                              btnResize.text = "🔍 CROP"
                          }
                          AspectRatioFrameLayout.RESIZE_MODE_ZOOM -> {
                              currentAspectMode = AspectRatioFrameLayout.RESIZE_MODE_FILL
                              playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FILL
                              btnResize.text = "↔️ FILL"
                          }
                          else -> {
                              currentAspectMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
                              playerView.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
                              btnResize.text = "🔲 FIT"
                          }
                      }
                  }

                  // Gear Settings Button (⚙️) -> Speed, Boost, Audio Tracks
                  findViewById<TextView>(R.id.btn_settings_gear)?.setOnClickListener {
                      showSettingsMenu()
                  }
              }

              private fun showSettingsMenu() {
                  val options = arrayOf("🔊 Audio Language / Tracks", "⚡ Playback Speed (${currentSpeed}x)", "🚀 Audio Boost (${currentBoostPercent}%)")
                  AlertDialog.Builder(this)
                      .setTitle("Player Settings ⚙️")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> showAudioTrackSelection()
                              1 -> showSpeedSelection()
                              2 -> showAudioBoostSelection()
                          }
                      }
                      .show()
              }

              private fun showAudioTrackSelection() {
                  val p = player ?: return
                  val currentTracks = p.currentTracks
                  val audioTracks = ArrayList<Pair<String, TrackSelectionOverride>>()

                  for (group in currentTracks.groups) {
                      if (group.type == C.TRACK_TYPE_AUDIO) {
                          val mediaTrackGroup = group.mediaTrackGroup
                          for (i in 0 until mediaTrackGroup.length) {
                              val format = mediaTrackGroup.getFormat(i)
                              val language = format.language ?: "Unknown"
                              val label = format.label ?: "Track ${audioTracks.size + 1}"
                              val trackName = "$label ($language)"
                              audioTracks.add(Pair(trackName, TrackSelectionOverride(mediaTrackGroup, i)))
                          }
                      }
                  }

                  if (audioTracks.isEmpty()) {
                      Toast.makeText(this, "No alternate audio tracks available", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val names = audioTracks.map { it.first }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Select Audio Track / Language")
                      .setItems(names) { _, index ->
                          val override = audioTracks[index].second
                          p.trackSelectionParameters = p.trackSelectionParameters
                              .buildUpon()
                              .setOverrideForType(override)
                              .build()
                          Toast.makeText(this, "Audio Track Changed: ${names[index]}", Toast.LENGTH_SHORT).show()
                      }
                      .show()
              }

              private fun showSpeedSelection() {
                  val speeds = arrayOf("0.5x", "1.0x (Normal)", "1.25x", "1.5x", "2.0x")
                  val values = floatArrayOf(0.5f, 1.0f, 1.25f, 1.5f, 2.0f)

                  AlertDialog.Builder(this)
                      .setTitle("Select Playback Speed")
                      .setItems(speeds) { _, index ->
                          currentSpeed = values[index]
                          player?.playbackParameters = PlaybackParameters(currentSpeed)
                          Toast.makeText(this, "Speed set to ${speeds[index]}", Toast.LENGTH_SHORT).show()
                      }
                      .show()
              }

              private fun showAudioBoostSelection() {
                  val boosts = arrayOf("OFF (100%)", "120%", "150%", "180%", "200% (Maximum Boost)")
                  val percents = intArrayOf(100, 120, 150, 180, 200)

                  AlertDialog.Builder(this)
                      .setTitle("Select Audio Booster (Up to 200%)")
                      .setItems(boosts) { _, index ->
                          currentBoostPercent = percents[index]
                          applyAudioBoost(currentBoostPercent)
                          Toast.makeText(this, "Audio Boost: $currentBoostPercent%", Toast.LENGTH_SHORT).show()
                      }
                      .show()
              }

              private fun applyAudioBoost(percent: Int) {
                  val p = player ?: return
                  val sessionId = p.audioSessionId
                  if (sessionId == C.AUDIO_SESSION_ID_UNSET) return

                  try {
                      if (loudnessEnhancer == null) {
                          loudnessEnhancer = LoudnessEnhancer(sessionId)
                      }
                      if (percent > 100) {
                          // Gain calculation up to 200%
                          val gainmB = (percent - 100) * 15 // Millibels gain
                          loudnessEnhancer?.setTargetGain(gainmB)
                          loudnessEnhancer?.enabled = true
                      } else {
                          loudnessEnhancer?.enabled = false
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun setupTouchGestures() {
                  val gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onScroll(e1: MotionEvent?, e2: MotionEvent, distanceX: Float, distanceY: Float): Boolean {
                          if (e1 == null) return false
                          val sWidth = resources.displayMetrics.widthPixels
                          if (e1.x < sWidth / 2) {
                              // Left Half -> Brightness Control
                              val lp = window.attributes
                              val change = distanceY / resources.displayMetrics.heightPixels
                              val newBrightness = (lp.screenBrightness + change).coerceIn(0.01f, 1.0f)
                              lp.screenBrightness = newBrightness
                              window.attributes = lp
                              showHud("☀️ Brightness: ${(newBrightness * 100).toInt()}%")
                          } else {
                              // Right Half -> Volume & Boost Control
                              val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                              val maxVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                              val curVol = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC)

                              if (distanceY > 0) {
                                  if (curVol < maxVol) {
                                      audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, 0)
                                      val updatedVol = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC)
                                      val percent = (updatedVol.toFloat() / maxVol * 100).toInt()
                                      showHud("🔊 Volume: $percent%")
                                  } else if (currentBoostPercent < 200) {
                                      currentBoostPercent = (currentBoostPercent + 2).coerceAtMost(200)
                                      applyAudioBoost(currentBoostPercent)
                                      showHud("🚀 Volume Boost: $currentBoostPercent%")
                                  }
                              } else {
                                  if (currentBoostPercent > 100) {
                                      currentBoostPercent = (currentBoostPercent - 2).coerceAtLeast(100)
                                      applyAudioBoost(currentBoostPercent)
                                      showHud("🚀 Volume Boost: $currentBoostPercent%")
                                  } else {
                                      audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, 0)
                                      val updatedVol = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC)
                                      val percent = (updatedVol.toFloat() / maxVol * 100).toInt()
                                      showHud("🔊 Volume: $percent%")
                                  }
                              }
                          }
                          return true
                      }
                  })

                  playerView.setOnTouchListener { _, event ->
                      gestureDetector.onTouchEvent(event)
                      false
                  }
              }

              private fun showHud(text: String) {
                  hudText.text = text
                  hudLayout.visibility = View.VISIBLE
                  hideHudHandler.removeCallbacks(hideHudRunnable)
                  hideHudHandler.postDelayed(hideHudRunnable, 1500)
              }

              private fun initEngine() {
                  if (videoUriStr == null) return

                  player = ExoPlayer.Builder(this).build().also { exo ->
                      playerView.player = exo
                      val mediaItem = MediaItem.fromUri(Uri.parse(videoUriStr))
                      exo.setMediaItem(mediaItem)

                      val prefs = getSharedPreferences("OfflineVideoPrefs", Context.MODE_PRIVATE)
                      val savedPos = prefs.getLong(videoUriStr, 0L)
                      if (savedPos > 0) {
                          exo.seekTo(savedPos)
                      }

                      exo.prepare()
                      exo.playWhenReady = true
                  }
              }

              override fun onStop() {
                  super.onStop()
                  player?.let { exo ->
                      val prefs = getSharedPreferences("OfflineVideoPrefs", Context.MODE_PRIVATE)
                      prefs.edit().putLong(videoUriStr, exo.currentPosition).apply()
                      exo.release()
                  }
                  loudnessEnhancer?.release()
                  player = null
              }
          }
