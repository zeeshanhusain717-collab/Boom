name: Build ZAI AI App APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ZAI AI App APK
    runs-on: ubuntu-latest

    steps:
      - name: 01 - Checkout repository
        uses: actions/checkout@v4

      - name: 02 - Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: 03 - Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 04 - Install Android SDK 34
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 05 - Create project directories
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zai/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

      - name: 06 - Write gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

      - name: 07 - Write settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZAI"
          include(":app")
          EOF

      - name: 08 - Write root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

      - name: 09 - Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: 10 - Write app/build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zai.app"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zai.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
          }
          EOF

      - name: 11 - Write strings.xml & colors.xml
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ZAI</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="sky_blue">#0284C7</color>
              <color name="sky_blue_light">#38BDF8</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
              <color name="bg_light">#F8FAFC</color>
          </resources>
          EOF

      - name: 12 - Create White & Sky Blue 3D Vector Z Logo and App Icon
        run: |
          cat > app/src/main/res/drawable/ic_z_3d_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="100dp"
              android:height="100dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <!-- 3D Depth Shadow Layer -->
              <path
                  android:fillColor="#0369A1"
                  android:pathData="M25,25 L75,25 L75,37 L42,67 L75,67 L75,79 L25,79 L25,67 L58,37 L25,37 Z"
                  android:translationX="3"
                  android:translationY="4" />
              <!-- Front White Z Layer -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M25,25 L75,25 L75,37 L42,67 L75,67 L75,79 L25,79 L25,67 L58,37 L25,37 Z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#38BDF8"/>
                          <item android:offset="1.0" android:color="#0284C7"/>
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF
          
          cat > app/src/main/res/drawable/ic_launcher_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0369A1"
                  android:pathData="M30,30 L78,30 L78,42 L48,68 L78,68 L78,78 L30,78 L30,68 L60,42 L30,42 Z"
                  android:translationX="3"
                  android:translationY="4" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M30,30 L78,30 L78,42 L48,68 L78,68 L78,78 L30,78 L30,68 L60,42 L30,42 Z" />
          </vector>
          EOF
          
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF

      - name: 13 - Write AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

      - name: 14 - Write MainActivity.kt (ZAI Full UI Design)
        run: |
          cat > app/src/main/java/com/zai/app/MainActivity.kt <<'EOF'
          package com.zai.app

          import android.animation.ObjectAnimator
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.animation.OvershootInterpolator
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var splashView: LinearLayout
              private lateinit var mainContainer: LinearLayout
              private lateinit var chatLayout: LinearLayout
              private lateinit var modeBanner: TextView
              private lateinit var inputEditText: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val rootLayout = FrameLayout(this).apply {
                      setBackgroundColor(Color.parseColor("#0284C7"))
                  }

                  // 1. Splash Screen
                  splashView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )

                      val logoImg = ImageView(context).apply {
                          setImageResource(R.drawable.ic_z_3d_logo)
                          layoutParams = LinearLayout.LayoutParams(220, 220)
                      }

                      val appTitle = TextView(context).apply {
                          text = "ZAI"
                          textSize = 36f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.WHITE)
                          setPadding(0, 20, 0, 0)
                      }

                      val subTitle = TextView(context).apply {
                          text = "Next-Gen AI Assistant"
                          textSize = 14f
                          setTextColor(Color.parseColor("#E0F2FE"))
                      }

                      addView(logoImg)
                      addView(appTitle)
                      addView(subTitle)
                  }

                  // 2. Main App Container
                  mainContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                      setBackgroundColor(Color.parseColor("#F8FAFC"))
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  }

                  // Top Header Bar
                  val headerBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(35, 45, 35, 45)
                      setBackgroundColor(Color.parseColor("#0284C7"))
                      elevation = 12f
                  }

                  val headerLogo = ImageView(this).apply {
                      setImageResource(R.drawable.ic_z_3d_logo)
                      layoutParams = LinearLayout.LayoutParams(80, 80)
                  }

                  val headerTextLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(25, 0, 0, 0)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val headerTitle = TextView(this).apply {
                      text = "किसान (ZAI)"
                      textSize = 19f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                  }

                  val headerStatus = TextView(this).apply {
                      text = "साधारण बातचीत व स्वास्थ्य सलाहकार"
                      textSize = 11f
                      setTextColor(Color.parseColor("#BAE6FD"))
                  }

                  headerTextLayout.addView(headerTitle)
                  headerTextLayout.addView(headerStatus)

                  // Round "Set" Button
                  val setRoundButton = Button(this).apply {
                      text = "Set"
                      textSize = 13f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#0284C7"))
                      
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.WHITE)
                      }
                      layoutParams = LinearLayout.LayoutParams(110, 110)
                      
                      setOnClickListener { view ->
                          openOptionMenu(view, headerStatus)
                      }
                  }

                  headerBar.addView(headerLogo)
                  headerBar.addView(headerTextLayout)
                  headerBar.addView(setRoundButton)

                  // Mode Indicator Banner
                  modeBanner = TextView(this).apply {
                      text = "💡 मोड: सामान्य बातचीत व स्वास्थ्य सम्बन्धी सवाल"
                      textSize = 12f
                      setTextColor(Color.parseColor("#0369A1"))
                      setBackgroundColor(Color.parseColor("#E0F2FE"))
                      setPadding(30, 15, 30, 15)
                      gravity = Gravity.CENTER
                  }

                  // Chat Message Scroll View
                  val scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                      isFillViewport = true
                  }

                  chatLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 30, 30, 30)
                  }

                  addMessageBubble("नमस्ते! मैं ZAI हूँ। आप मुझसे कोई भी सवाल पूछ सकते हैं या स्वास्थ्य/बीमारी सम्बन्धी जानकारी ले सकते हैं। ऊपर गोल 'Set' बटन दबाकर आप वीडियो, इमेज या कोड मोड चुन सकते हैं।", isUser = false)

                  scrollView.addView(chatLayout)

                  // Bottom Input Dock
                  val inputDock = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(20, 20, 20, 20)
                      setBackgroundColor(Color.WHITE)
                      elevation = 16f
                  }

                  val micBtn = createIconButton("🎙️") {
                      Toast.makeText(this, "आवाज रिकॉर्डिंग मोड ऑन", Toast.LENGTH_SHORT).show()
                  }

                  val galleryBtn = createIconButton("🖼️") {
                      Toast.makeText(this, "गैलरी से फोटो चुनें (AI एनालिसिस हेतु)", Toast.LENGTH_SHORT).show()
                  }

                  val videoBtn = createIconButton("🎥") {
                      Toast.makeText(this, "वीडियो चुनें (AI कहानी/समस्या निवारण हेतु)", Toast.LENGTH_SHORT).show()
                  }

                  inputEditText = EditText(this).apply {
                      hint = "यहाँ संदेश या सवाल लिखें..."
                      textSize = 14f
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.BLACK)
                      setPadding(30, 20, 30, 20)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#F1F5F9"))
                          cornerRadius = 40f
                      }
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          setMargins(10, 0, 10, 0)
                      }
                  }

                  val sendBtn = Button(this).apply {
                      text = "➔"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#0284C7"))
                      }
                      layoutParams = LinearLayout.LayoutParams(110, 110)

                      setOnClickListener {
                          val txt = inputEditText.text.toString().trim()
                          if (txt.isNotEmpty()) {
                              addMessageBubble(txt, isUser = true)
                              inputEditText.text.clear()
                          }
                      }
                  }

                  inputDock.addView(micBtn)
                  inputDock.addView(galleryBtn)
                  inputDock.addView(videoBtn)
                  inputDock.addView(inputEditText)
                  inputDock.addView(sendBtn)

                  mainContainer.addView(headerBar)
                  mainContainer.addView(modeBanner)
                  mainContainer.addView(scrollView)
                  mainContainer.addView(inputDock)

                  rootLayout.addView(splashView)
                  rootLayout.addView(mainContainer)

                  setContentView(rootLayout)

                  runSplashAnimation()
              }

              private fun openOptionMenu(view: View, statusText: TextView) {
                  val popup = PopupMenu(this, view)
                  popup.menu.add("🎥 वीडियो जनरेट (Video Generate)")
                  popup.menu.add("🎨 इमेज जनरेट (Image Generate)")
                  popup.menu.add("💻 कोड जनरेट (Code Generate)")
                  popup.menu.add("💬 सामान्य बातचीत व स्वास्थ्य (General)")

                  popup.setOnMenuItemClickListener { item ->
                      when (item.title.toString()) {
                          "🎥 वीडियो जनरेट (Video Generate)" -> {
                              modeBanner.text = "🎬 मोड: AI वीडियो जनरेटर मोड सक्रिय"
                              statusText.text = "वीडियो जनरेशन मोड"
                              addSystemNotice("वीडियो जनरेट चैट मोड चालू हो गया है। प्रॉम्ट लिखें या वीडियो अपलोड करें।")
                          }
                          "🎨 इमेज जनरेट (Image Generate)" -> {
                              modeBanner.text = "🎨 मोड: AI फोटो/इमेज जनरेटर मोड सक्रिय"
                              statusText.text = "इमेज जनरेशन मोड"
                              addSystemNotice("इमेज जनरेट मोड चालू हो गया है। अपनी पसंद का फोटो वर्णन लिखें।")
                          }
                          "💻 कोड जनरेट (Code Generate)" -> {
                              modeBanner.text = "💻 मोड: प्रोग्रामिंग व कोड जनरेटर सक्रिय"
                              statusText.text = "कोडिंग मोड"
                              addSystemNotice("कोड राइटिंग मोड चालू हो गया है। अपनी भाषा या लॉजिक बताएं।")
                          }
                          else -> {
                              modeBanner.text = "💡 मोड: सामान्य बातचीत व स्वास्थ्य सम्बन्धी सवाल"
                              statusText.text = "साधारण बातचीत व स्वास्थ्य सलाहकार"
                              addSystemNotice("सामान्य बातचीत व मेडिकल हेल्प मोड सक्रिय है।")
                          }
                      }
                      true
                  }
                  popup.show()
              }

              private fun addMessageBubble(text: String, isUser: Boolean) {
                  val bubble = TextView(this).apply {
                      this.text = text
                      textSize = 14f
                      setPadding(35, 25, 35, 25)
                      elevation = 4f

                      if (isUser) {
                          setTextColor(Color.WHITE)
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor("#0284C7"))
                              cornerRadii = floatArrayOf(40f, 40f, 0f, 40f, 40f, 40f, 40f, 40f)
                          }
                      } else {
                          setTextColor(Color.parseColor("#1E293B"))
                          background = GradientDrawable().apply {
                              setColor(Color.WHITE)
                              cornerRadii = floatArrayOf(0f, 40f, 40f, 40f, 40f, 40f, 40f, 40f)
                          }
                      }
                  }

                  val params = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      gravity = if (isUser) Gravity.END else Gravity.START
                      setMargins(0, 15, 0, 15)
                  }

                  chatLayout.addView(bubble, params)
              }

              private fun addSystemNotice(notice: String) {
                  val noticeView = TextView(this).apply {
                      text = notice
                      textSize = 11f
                      setTextColor(Color.GRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 15, 0, 15)
                  }
                  chatLayout.addView(noticeView)
              }

              private fun createIconButton(icon: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = icon
                      textSize = 16f
                      setBackgroundColor(Color.TRANSPARENT)
                      layoutParams = LinearLayout.LayoutParams(90, 90)
                      setOnClickListener { onClick() }
                  }
              }

              private fun runSplashAnimation() {
                  val scaleX = ObjectAnimator.ofFloat(splashView, "scaleX", 0.8f, 1.1f, 1.0f).setDuration(1200)
                  val scaleY = ObjectAnimator.ofFloat(splashView, "scaleY", 0.8f, 1.1f, 1.0f).setDuration(1200)
                  scaleX.interpolator = OvershootInterpolator()
                  scaleY.interpolator = OvershootInterpolator()
                  scaleX.start()
                  scaleY.start()

                  splashView.postDelayed({
                      splashView.animate().alpha(0f).setDuration(400).withEndAction {
                          splashView.visibility = View.GONE
                          mainContainer.visibility = View.VISIBLE
                          mainContainer.alpha = 0f
                          mainContainer.animate().alpha(1f).setDuration(400).start()
                      }.start()
                  }, 2200)
              }
          }
          EOF

      - name: 15 - Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 16 - Upload ZAI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAI-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk

